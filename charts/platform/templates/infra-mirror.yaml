apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: docker-mirror-username
spec:
  length: 20
  digits: 5
  symbols: 0
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: docker-mirror-password
spec:
  length: 48
  digits: 8
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-mirror-credentials
spec:
  refreshPolicy: CreatedOnce
  target:
    name: docker-mirror-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      engineVersion: v2
      mergePolicy: Merge
      type: Opaque
      data:
        htpasswd: '{{ `{{ htpasswd .username .password "bcrypt" }}` }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: docker-mirror-username
      rewrite:
        - regexp:
            source: "^password$"
            target: username
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: docker-mirror-password
      rewrite:
        - regexp:
            source: "^password$"
            target: password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: docker-mirror-credentials
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: docker-mirror-credentials
  template:
    engineVersion: v2
    data:
      username: {{ "{{ .username }}" | quote }}
      password: {{ "{{ .password }}" | quote }}
      hostname: {{ printf "dockerhub.%s" .Values.domains.external | quote }}
  data:
    {{- range $property := list "username" "password" "hostname" }}
    - match:
        secretKey: {{ $property }}
        remoteRef:
          remoteKey: dynamic/docker-mirror
          property: {{ $property }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docker-pull-auth
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: docker-pull-auth
    template:
      type: Opaque
  data:
    - remoteRef:
        key: vendor/docker
        property: public-username
      secretKey: USERNAME
    - remoteRef:
        key: vendor/docker
        property: public-password
      secretKey: PASSWORD
    - remoteRef:
        key: vendor/docker
        property: http-secret
      secretKey: HTTP_SECRET
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docker-pull
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: {{ .Values.storage.nobackup }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-pull
  annotations:
    secret.reloader.stakater.com/reload: docker-mirror-credentials,docker-pull-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-pull
  template:
    metadata:
      labels:
        app: docker-pull
    spec:
      imagePullSecrets:
        - name: cluster-docker-secrets
      containers:
        - name: app
          image: docker.io/{{ .Values.registry.image.repository }}:{{ .Values.versions.registry }}
          env:
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: docker-pull-auth
                  key: HTTP_SECRET
            - name: REGISTRY_AUTH
              value: htpasswd
            - name: REGISTRY_AUTH_HTPASSWD_REALM
              value: Registry Realm
            - name: REGISTRY_AUTH_HTPASSWD_PATH
              value: /auth/htpasswd
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            - name: REGISTRY_PROXY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: docker-pull-auth
                  key: USERNAME
            - name: REGISTRY_PROXY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: docker-pull-auth
                  key: PASSWORD
            - name: REGISTRY_PROXY_TTL
              value: 168h
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          resources:
            {{- with.Values.registry.resources }}
            requests:
              {{- toYaml . | nindent 14 }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          ports:
            - containerPort: 5000
              name: port-5000
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - mountPath: /var/lib/registry
              name: config
            - mountPath: /auth
              name: htpasswd
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: docker-pull
        - name: htpasswd
          secret:
            defaultMode: 420
            secretName: docker-mirror-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: docker-pull
spec:
  ports:
    - name: port-5000
      port: 5000
      protocol: TCP
      targetPort: 5000
  selector:
    app: docker-pull
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docker-pull
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: gateway
    namespace: system-envoy
    sectionName: https
  hostnames:
  - dockerhub.{{ .Values.domains.external }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: docker-pull
      port: 5000
    name: http-0
---
# Envoy's full-body buffer is limited to uint32 bytes. Keep multi-GB uploads
# streaming, and enforce the legacy 5000 MiB limit on declared Content-Length.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: docker-pull
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: docker-pull
  lua:
    - type: Inline
      inline: |
        function envoy_on_request(handle)
          local length = tonumber(handle:headers():get("content-length"))
          if length and length > 5242880000 then
            handle:respond({[":status"] = "413"}, "Request body too large")
          end
        end

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: docker-pull-web-rps
spec:
  scaleTargetRef:
    name: docker-pull
    kind: Deployment
  pollingInterval: 10
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.system-monitoring.svc:9090
        metricName: registr_web_rps_per_pod
        threshold: "2"
        query: |
          sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/{{ .Release.Namespace }}/docker-pull/.*"}[1m]))
          /
          count(kube_pod_info{namespace="{{ .Release.Namespace }}",pod=~"docker-pull-.*"})
