image:
  name: dockerhub.yusufali.ca/gtstef/filebrowser
  tag: 2.0.2-stable

strategy:
  type: Recreate

imagePullSecrets:
  - name: cluster-docker-secrets

ports:
  - name: web
    containerPort: 80

service:
  port: 80
  ports:
    - port: 80
      targetPort: web
      protocol: TCP
      name: web

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 200m
    memory: 1Gi

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 0

volumeMounts:
  - name: storage
    mountPath: /home/filebrowser/data
    subPath: quantum-data
  - name: filebrowser-config
    mountPath: /home/filebrowser/data/config.yaml
    subPath: config.yaml
    readOnly: true
  - name: storage
    mountPath: /srv
    subPath: data
  - name: social-media
    mountPath: /srv/social_media

volumes:
  - name: social-media
    nfs:
      server: 192.168.1.3
      path: /nobackup/models/social_media
  - name: filebrowser-config
    secret:
      secretName: filebrowser-config
      items:
        - key: config.yaml
          path: config.yaml

pvc:
  enabled: true
  name: storage
  storageClass: thorin-default

ingress:
  enabled: true
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 512m
    nginx.ingress.kubernetes.io/client_max_body_size: 512m
    nginx.ingress.kubernetes.io/client-body-buffer-size: 512m
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  tls:
    - hosts:
        - "*.yusufali.ca"
      secretName: wildcard-tls
  hosts:
    - host: drive.yusufali.ca
      paths:
        - path: /
          pathType: Prefix

probes:
  livenessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
