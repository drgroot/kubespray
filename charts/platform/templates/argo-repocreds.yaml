apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-repo-credentials
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
spec:
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: tenant-repo-credentials
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://git.yusufali.ca/
        username: '{{ printf "{{ .USERNAME }}" }}'
        password: '{{ printf "{{ .PASSWORD }}" }}'
  data:
    - secretKey: PASSWORD
      remoteRef:
        key: vendor/gitea
        property: argo-password
    - secretKey: USERNAME
      remoteRef:
        key: vendor/gitea
        property: argo-username
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-repo-credentials
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
spec:
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: oci-repo-credentials
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: oci
        url: 'oci://{{ .HOST }}/{{ .USERNAME }}'
        username: '{{ printf "{{ .USERNAME }}" }}'
        password: '{{ printf "{{ .PASSWORD }}" }}'
  data:
    - secretKey: HOST
      remoteRef:
        key: vendor/docker
        property: private-host
    - secretKey: USERNAME
      remoteRef:
        key: vendor/docker
        property: private-username
    - secretKey: PASSWORD
      remoteRef:
        key: vendor/docker
        property: private-password
