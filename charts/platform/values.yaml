      enabled: true
      type: valuegen
      provider: openbao
      name: postgres
      vars:
        - key: input
          value: onprem/vendor/postgres
        - key: properties
          value: root-username,root-password
        - key: value-types
          value: username,password
        - key: specialchars
          value: no,no
        - key: output
