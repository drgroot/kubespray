image: postgres:16.3
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

annotations: {}

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "250m"
    memory: "512Mi"

storageclass: nfs-thorin-ssd-raid0

# Optional direct volume source for the Postgres data volume. When set, the
# data PVC is not created. The value must be a Kubernetes volume source, for
# example:
# volume:
#   iscsi:
#     fsType: ext4
#     iqn: iqn.2026-01.com.middleearth:thorin
#     iscsiInterface: default
#     lun: 1
#     targetPortal: 192.168.1.3:3260
volume: {}

server:
  password:
    secretname: postgres-password
    key: password
  databasename: postgres
  username: postgres

  additionalUsers: []
    # - name: test
    #   passwordkey: password-test
    #   schema: test

pushsecret:
  enabled: true
  secretstore: default
  secretStoreKind: SecretStore
  remoteKey: postgres-credentials

backup:
  schedule: "0 0 * * *"
  storageclass: nfs-thorin-backups
