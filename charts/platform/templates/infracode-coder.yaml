{{- if .Values.coder.enabled -}}
{{- if .Values.coder.serviceAccount.create }}
{{- range $tenant := .Values.coder.targetNamespaces }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $.Values.coder.serviceAccount.name }}
  namespace: {{ $tenant }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Values.coder.serviceAccount.name }}
  namespace: {{ $tenant }}
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["services", "pods", "pods/log"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["*"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["*"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects", "scaledjobs"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["HorizontalPodAutoscaler"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coder-workspace-binding
  namespace: {{ $tenant }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.coder.serviceAccount.name }}
    namespace: {{ $tenant }}
roleRef:
  kind: Role
  name: {{ $.Values.coder.serviceAccount.name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-postgres-secrets
  namespace: {{ .Values.coder.namespace }}
spec:
  secretStoreRef:
    name: {{ .Values.coder.secretStore.secretStoreName }}
    kind: {{ .Values.coder.secretStore.secretStoreKind }}
  target:
    name: coder-postgres-secrets
    template:
      engineVersion: v2
      data:
        url: "{{ `{{ .raw_url }}` }}?sslmode=disable"
  data:
    - remoteRef:
        key: {{ .Values.coder.secretStore.remoteRef }}
        property: {{ .Values.coder.secretStore.property }}
      secretKey: raw_url
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-coder
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  destination:
    namespace: {{ .Values.coder.namespace }}
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: coder
    repoURL: https://helm.coder.com/v2
    targetRevision: {{ .Values.versions.coder }}
    helm:
      releaseName: system-coder
      values: |-
        coder:
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 100m
              memory: 512Mi

          env:
            - name: CODER_ACCESS_URL
              value: https://{{ tpl .Values.coder.route.domain . }}
            - name: CODER_WILDCARD_ACCESS_URL
              value: "*.{{ tpl .Values.coder.route.domain . }}"
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: coder-postgres-secrets
                  key: url
            {{- with .Values.coder.env }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}

          service:
            type: ClusterIP

          serviceAccount:
            {{- if .Values.coder.targetNamespaces }}
            workspaceNamespaces:
            {{- range $tenant := .Values.coder.targetNamespaces }}
            - name: {{ $tenant }}
            {{- end }}
            {{- end }}

          ingress:
            enable: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-oauth-secrets
  namespace: {{ .Values.coder.namespace }}
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: coder-oauth-secrets
  data:
    - secretKey: CODER_OIDC_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.authelia.clients.client_remote_key }}
        property: {{ .Values.authelia.clients.list.coder.client_secret_property }}

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  namespace: "{{ .Values.coder.namespace }}"
spec:
  parentRefs:
  - name: gateway
    namespace: system-envoy
    sectionName: https
  hostnames:
  - {{ tpl .Values.coder.route.domain . }}
  - '*.{{ tpl .Values.coder.route.domain . }}'
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: coder
      port: 80
{{- end }}
