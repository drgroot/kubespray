apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenant-repo-credentials
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: tenant-repo-credentials
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://git.yusufali.ca/
        username: fakeuser
        password: '{{ printf "{{ .TOKEN }}" }}'
  data:
    - secretKey: TOKEN
      remoteRef:
        key: dynamic/gitea-argocd
        property: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-repo-credentials
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: oci-repo-credentials
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: oci
        url: '{{ printf "oci://{{ .HOST }}/{{ .USERNAME }}" }}'
        username: '{{ printf "{{ .USERNAME }}" }}'
        password: '{{ printf "{{ .PASSWORD }}" }}'
  data:
    - secretKey: HOST
      remoteRef:
        key: vendor/docker
        property: private-host
    - secretKey: USERNAME
      remoteRef:
        key: vendor/docker
        property: private-username
    - secretKey: PASSWORD
      remoteRef:
        key: vendor/docker
        property: private-password
