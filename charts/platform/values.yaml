gitea:
  actions:
    version: 0.0.4
    maxRunners: 5

    resources:
      requests:
        memory: "2Gi"
        cpu: "1"
      limits:
        memory: "4Gi"
        cpu: "2"

secretSync:
  - name: docker
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: vendor/docker
      properties:
        - private-host
        - private-username
        - private-password
        - host-mirror
        - mirror-username
        - mirror-password
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/docker
      properties:
        private-host: host
        private-username: username
        private-password: password
        host-mirror: host-mirror
        mirror-username: mirror-username
        mirror-password: mirror-password

  - name: npm
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: vendor/npm
      properties:
        - password
        - username
        - read-username
        - read-password
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/npm
      properties:
        password: npm_write_pass
        username: npm_write_user
        read-username: npm_read_user
        read-password: npm_read_pass

  - name: pip
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: vendor/pip
      properties:
        - host
        - password
        - username
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/pip
      properties:
        host: url
        password: token
        username: username

  - name: coder-postgres
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: iac/postgres-coder
      properties:
        - url
    output:
      kind: ClusterSecretStore
      name: servc
      path: nonprod/coder-postgres-secret
      properties:
        url: onprem-url

  - name: vault
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: vendor/vault
      properties:
        - servc-username
        - servc-password
        - token
        - url
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/vault
      properties:
        servc-username: username
        servc-password: password
        url: vault-addr
        token: vault-token
