      <body>
        <main>
          <p class="eyebrow">Postiz at yusufali.ca</p>
          <h1>Privacy Policy</h1>
          <p class="updated"><strong>Effective:</strong> September 7, 2026</p>

          <p>This Privacy Policy explains how Yusuf Ali (“we,” “us,” or “our”) handles personal information when operating the private Postiz deployment at <a href="https://postiz.yusufali.ca">postiz.yusufali.ca</a> (the “Service”). This policy applies to this deployment only; it does not govern the Postiz hosted service or any social network or other third-party service.</p>

          <h2>1. Information we collect</h2>
          <p>Depending on how you use the Service, we may collect:</p>
          <ul>
            <li><strong>Account information:</strong> your name, email address, profile details, internal user and organization identifiers, authentication events, and permissions received from our identity provider.</li>
            <li><strong>Connected-account information:</strong> social platform account and page identifiers, usernames, profile information, granted permissions, access and refresh tokens, and other information required by a platform’s API.</li>
            <li><strong>Content and scheduling data:</strong> drafts, captions, links, media, comments, publication settings, approval information, schedules, and the results or status of publishing actions.</li>
            <li><strong>Social platform data:</strong> posts, messages or comments you choose to manage, audience and engagement metrics, and other data made available through connected platform APIs and the permissions you grant.</li>
            <li><strong>Technical and usage data:</strong> IP address, browser and device information, timestamps, request and error logs, cookie or session identifiers, feature usage, and security events.</li>
            <li><strong>Communications:</strong> information you provide when requesting support, reporting a problem, or otherwise contacting us.</li>
          </ul>

          <h2>2. How we use information</h2>
          <p>We use personal information to authenticate users; connect and manage authorized social accounts; store, schedule, publish, and analyze content as directed; provide collaboration and account features; send operational messages; troubleshoot and support the Service; prevent abuse and protect users, connected accounts, and infrastructure; maintain backups and reliability; comply with law; and enforce our <a href="/tos">Terms of Service</a>. We do not sell personal information or use it for third-party behavioral advertising.</p>

          <h2>3. Authority and legal bases</h2>
          <p>We process information at your request to provide the Service and carry out our agreement with you, with your consent where required (including when you connect a third-party account), for our legitimate interests in operating and securing this private Service, and to comply with legal obligations. You may withdraw consent by disconnecting an integration or contacting us, but this does not affect processing already completed.</p>

          <h2>4. How information is shared</h2>
          <p>We disclose information only as needed to operate the Service or as required by law, including:</p>
          <ul>
            <li><strong>Social platforms you connect:</strong> content, instructions, account identifiers, and related data are exchanged with those platforms at your direction.</li>
            <li><strong>Infrastructure and service providers:</strong> hosting, storage, database, identity, email, monitoring, and security providers may process information for us under appropriate restrictions.</li>
            <li><strong>Other authorized users:</strong> information may be visible to members of an organization or workspace to which you belong according to their permissions.</li>
            <li><strong>Legal and safety recipients:</strong> we may disclose information when reasonably necessary to comply with law, respond to valid legal process, protect rights or safety, investigate abuse, or secure the Service.</li>
            <li><strong>Business transfers:</strong> information may be transferred as part of a reorganization, sale, or transfer of the Service, subject to this policy and applicable law.</li>
          </ul>
          <p>Third-party platforms process information under their own privacy policies. Review a platform’s policy before connecting it to the Service.</p>

          <h2>5. Cookies and similar technologies</h2>
          <p>The Service and its identity provider use cookies or similar local storage that are necessary for sign-in, security, session continuity, and user preferences. We do not use advertising cookies on the Service.</p>

          <h2>6. Retention</h2>
          <p>We retain account, connected-account, content, and usage information for as long as needed to provide and secure the Service, maintain reasonable business and security records, resolve disputes, and meet legal obligations. When you disconnect a social account, the Service stops using its authorization for new actions, although previously published content remains on the destination platform and some records may remain until deleted or aged out.</p>
          <p>After an account-deletion request is verified, we will delete or de-identify personal information that is no longer required within a reasonable period, ordinarily within 30 days. Residual copies may remain in encrypted or access-restricted backups until those backups rotate, ordinarily within 90 days, and information may be retained longer where required for security, fraud prevention, legal compliance, or the establishment or defence of legal claims.</p>

          <h2>7. Security</h2>
          <p>We use administrative, technical, and physical safeguards designed to protect personal information, including access controls, encrypted network transport, restricted infrastructure access, and backups. No storage or transmission method is completely secure, and we cannot guarantee absolute security. Keep your credentials secure and promptly report suspected compromise.</p>

          <h2>8. International processing</h2>
          <p>The Service, its providers, and connected social platforms may process information in Canada, the United States, or other countries. Privacy laws in those countries may differ from those where you live. Where required, we use appropriate contractual or other safeguards for cross-border transfers.</p>

          <h2>9. Your choices and rights</h2>
          <p>You may review or change certain information in the Service, disconnect social integrations, revoke the Service’s access from the relevant platform, or request access to, correction of, export of, or deletion of your personal information. Depending on where you live, you may also have rights to restrict or object to processing, withdraw consent, or complain to a privacy regulator. These rights may be subject to identity verification and lawful exceptions.</p>
          <p>To make a privacy request, email <a href="mailto:ali@yusuf.email">ali@yusuf.email</a>. Include enough information to identify your account and request, but do not send passwords or social platform access tokens by email. You may also contact your local privacy authority; in Canada, this may include the Office of the Privacy Commissioner of Canada or the relevant provincial regulator.</p>

          <h2>10. Platform-specific controls</h2>
          <p>Disconnecting an integration in the Service or revoking access in the social platform prevents future API access after the authorization becomes invalid. To remove content already published to a social network, use that network’s controls. Deleting information from the Service does not automatically delete copies already published or otherwise held by a third party.</p>

          <h2>11. Children</h2>
          <p>The Service is intended for adults and is not directed to children under 16. We do not knowingly collect personal information from children under 16. Contact us if you believe a child has provided information to the Service.</p>

          <h2>12. Changes to this policy</h2>
          <p>We may update this policy to reflect changes to the Service, our practices, or legal requirements. We will post the revised version here and change the effective date. If a change is material, we will provide reasonable additional notice where practical.</p>

          <h2>13. Contact</h2>
          <p>Yusuf Ali is the operator and person responsible for privacy questions concerning this deployment. Contact: <a href="mailto:ali@yusuf.email">ali@yusuf.email</a>.</p>

          <nav aria-label="Legal pages">
            <a href="/tos">Terms of Service</a>
            <a href="https://postiz.yusufali.ca">Return to Postiz</a>
          </nav>
        </main>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-legal-pages
  labels:
    app.kubernetes.io/name: postiz-legal-pages
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postiz-legal-pages
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postiz-legal-pages
    spec:
      securityContext:
        fsGroup: 101
      imagePullSecrets:
        - name: cluster-docker-secrets
      containers:
        - name: nginx
          image: dockerhub.yusufali.ca/library/nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - name: legal-pages
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: legal-pages
              mountPath: /usr/share/nginx/html/tos.html
              subPath: tos.html
              readOnly: true
            - name: legal-pages
              mountPath: /usr/share/nginx/html/privacy.html
              subPath: privacy.html
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: legal-pages
          configMap:
            name: postiz-legal-pages
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postiz-legal-pages
spec:
  selector:
    app.kubernetes.io/name: postiz-legal-pages
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: postiz-legal-pages
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: postiz.yusufali.ca
      http:
        paths:
          - path: /tos
            pathType: Exact
            backend:
              service:
                name: postiz-legal-pages
                port:
                  name: http
          - path: /privacy
            pathType: Exact
            backend:
              service:
                name: postiz-legal-pages
                port:
                  name: http
  tls:
    - hosts:
        - "*.yusufali.ca"
      secretName: wildcard-tls
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: postiz-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: iac/postgres-postiz, property: url}
    - secretKey: JWT_SECRET
      remoteRef: {key: vendor/postiz, property: jwt-secret}
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef: {key: iac/s3-postiz, property: accountid}
    - secretKey: CLOUDFLARE_ACCESS_KEY
      remoteRef: {key: iac/s3-postiz, property: accesskey}
    - secretKey: CLOUDFLARE_SECRET_ACCESS_KEY
      remoteRef: {key: iac/s3-postiz, property: secretkey}
    - secretKey: CLOUDFLARE_BUCKETNAME
      remoteRef: {key: iac/s3-postiz, property: bucket}
    - secretKey: CLOUDFLARE_BUCKET_URL
      remoteRef: {key: iac/s3-postiz, property: blob-url}
    - secretKey: CLOUDFLARE_REGION
      remoteRef: {key: iac/s3-postiz, property: region}
    - secretKey: POSTIZ_OAUTH_CLIENT_SECRET
      remoteRef:
        key: vendor/authelia-apps
        property: client-secret-postiz
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postiz-temporal-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: postiz-temporal-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_USER
      remoteRef: {key: iac/postgres-postiz-temporal, property: username}
    - secretKey: POSTGRES_PWD
      remoteRef: {key: iac/postgres-postiz-temporal, property: password}
    - secretKey: POSTGRES_SEEDS
      remoteRef: {key: iac/postgres-postiz-temporal, property: hostname}
    - secretKey: DBNAME
      remoteRef: {key: iac/postgres-postiz-temporal, property: database}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postiz-temporal-dynamicconfig
data:
  development-sql.yaml: |
    limit.maxIDLength:
      - value: 255
        constraints: {}
    system.forceSearchAttributesCacheRefreshOnRead:
      - value: true
        constraints: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-temporal-elasticsearch
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.default }}
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-elasticsearch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal-elasticsearch
  template:
    metadata:
      labels:
        app: temporal-elasticsearch
    spec:
      imagePullSecrets:
        - name: cluster-docker-secrets
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: dockerhub.yusufali.ca/library/elasticsearch:7.17.27
          env:
            - name: discovery.type
              value: single-node
            - name: ES_JAVA_OPTS
              value: -Xms256m -Xmx256m
            - name: xpack.security.enabled
              value: "false"
            - name: node.store.allow_mmap
              value: "false"
            - name: cluster.routing.allocation.disk.threshold_enabled
              value: "true"
            - name: cluster.routing.allocation.disk.watermark.low
              value: 512mb
            - name: cluster.routing.allocation.disk.watermark.high
              value: 256mb
            - name: cluster.routing.allocation.disk.watermark.flood_stage
              value: 128mb
          ports:
            - name: http
              containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postiz-temporal-elasticsearch
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-elasticsearch
spec:
  selector:
    app: temporal-elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: temporal
  template:
    metadata:
      labels:
        app: temporal
      annotations:
        secret.reloader.stakater.com/reload: postiz-temporal-postgres
    spec:
      imagePullSecrets:
        - name: cluster-docker-secrets
      containers:
        - name: temporal
          image: dockerhub.yusufali.ca/temporalio/auto-setup:1.28.1
          envFrom:
            - secretRef:
                name: postiz-temporal-postgres
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: SKIP_DB_CREATE
              value: "true"
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: config/dynamicconfig/development-sql.yaml
            - name: ENABLE_ES
              value: "true"
            - name: ES_SEEDS
              value: temporal-elasticsearch
            - name: ES_VERSION
              value: v7
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES
              value: "true"
          ports:
            - name: grpc
              containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: dynamicconfig
              mountPath: /etc/temporal/config/dynamicconfig
              readOnly: true
      volumes:
        - name: dynamicconfig
          configMap:
            name: postiz-temporal-dynamicconfig
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
spec:
  selector:
    app: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
