gitea:
  actions:
    version: 0.1.2
    maxRunners: 5

    resources:
      requests:
        memory: "2Gi"
        cpu: "1"
      limits:
        memory: "4Gi"
        cpu: "2"

secretSync:
  - name: authelia-oidc-clients
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: vendor/authelia-apps
      properties:
        - client-secret-argocd
        - client-secret-grafana
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/authelia
      properties:
        client-secret-argocd: client-secret-argocd
        client-secret-grafana: client-secret-grafana

  - name: gitea-username
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: vendor/gitea
      properties:
        - chintan-username
        - chintan-password
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/gitea
      properties:
        chintan-username: username
        chintan-password: password

  - name: gitea
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: iac/gitea
      properties:
        - token
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/gitea
      properties:
        token: token

  - name: docker
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: vendor/docker
      properties:
        - private-host
        - private-username
        - private-password
        - host-mirror
        - mirror-username
        - mirror-password
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/docker
      properties:
        private-host: host
        private-username: username
        private-password: password
        host-mirror: host-mirror
        mirror-username: mirror-username
        mirror-password: mirror-password

  - name: npm
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: vendor/npm
      properties:
        - password
        - username
        - read-username
        - read-password
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/npm
      properties:
        password: npm_write_pass
        username: npm_write_user
        read-username: npm_read_user
        read-password: npm_read_pass

  - name: pip
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: vendor/pip
      properties:
        - host
        - password
        - username
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/pip
      properties:
        host: url
        password: token
        username: username

  - name: coder-postgres
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: iac/postgres-coder
      properties:
        - url
    output:
      kind: ClusterSecretStore
      name: servc
      path: nonprod/coder-postgres-secret
      properties:
        url: onprem-url

  - name: vault
    input:
      kind: ClusterSecretStore
      name: external-infra
      path: iac/vault-user-servc
      properties:
        - username
        - password
        - token
        - vault-addr
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/vault
      properties:
        username: username
        password: password
        vault-addr: vault-addr
        token: vault-token
