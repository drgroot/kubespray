name: Test and Publish Steam Template

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - charts/coder-template/**
      - .github/workflows/coder-template.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: coder-steam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.filter.outputs.template }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect template changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            template:
              - 'charts/coder-template/**'
              - '.github/workflows/coder-template.yml'

      - uses: hashicorp/setup-terraform@v3
        if: steps.filter.outputs.template == 'true' || github.event_name == 'workflow_dispatch'
        with:
          terraform_version: 1.17.1
      - name: Validate template
        if: steps.filter.outputs.template == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: charts/coder-template
        run: |
          terraform fmt -recursive -check
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  publish:
    needs: validate
    # Fork PRs run validation without access to publishing credentials.
    if: >-
      (needs.validate.outputs.template == 'true' || github.event_name == 'workflow_dispatch')
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Coder credentials from Vault
        id: coder_secrets
        uses: hashicorp/vault-action@v2
        with:
          url: ${{ secrets.VAULT_URL }}
          method: token
          token: ${{ secrets.VAULT_TOKEN }}
          exportEnv: false
          secrets: |
            servc/data/iac/coder-onpremise url | CODER_URL ;
            servc/data/iac/coder-onpremise token | CODER_TOKEN ;
      - name: Set up Coder CLI
        uses: coder/setup-action@v1
        with:
          access_url: ${{ steps.coder_secrets.outputs.CODER_URL }}
          coder_session_token: ${{ steps.coder_secrets.outputs.CODER_TOKEN }}
      - name: Set template version metadata
        id: version
        run: |
          echo "name=git-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "message=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"
      - name: Upload inactive template version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_MESSAGE: ${{ steps.version.outputs.message }}
        run: |
          coder templates push steam \
            --display-name Steam \
            --activate=false \
            --name "$VERSION_NAME" \
            --message "$VERSION_MESSAGE" \
            --directory charts/coder-template \
            --ignore-lockfile \
            --yes
      - name: Promote template version
        if: github.ref == 'refs/heads/main'
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          coder templates versions promote \
            --template steam \
            --template-version "$VERSION_NAME"
