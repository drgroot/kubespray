fullnameOverride: onlyoffice

image:
  name: dockerhub.yusufali.ca/onlyoffice/documentserver
  tag: 10.0.0.1

imagePullSecrets:
  - name: cluster-docker-secrets

ports:
  - name: web
    containerPort: 80

service:
  port: 80
  ports:
    - port: 80
      targetPort: web
      protocol: TCP
      name: web

env:
  - name: JWT_ENABLED
    value: "true"
  - name: JWT_HEADER
    value: Authorization
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef:
        name: filebrowser-config
        key: onlyoffice-jwt-secret
  - name: ALLOW_PRIVATE_IP_ADDRESS
    value: "true"

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 4
    memory: 4Gi

route:
  enabled: true
  hosts:
  - host: onlyoffice.yusufali.ca
    paths:
    - path: /
      pathType: Prefix
  cors:
    allowOrigins:
    - https://drive.yusufali.ca
    allowMethods:
    - GET
    - PUT
    - POST
    - DELETE
    - PATCH
    - OPTIONS
  bodyLimit: 512Mi
  connectTimeout: 300s
  idleTimeout: 300s
probes:
  livenessProbe:
    httpGet:
      path: /healthcheck
      port: web
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /healthcheck
      port: web
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 12
