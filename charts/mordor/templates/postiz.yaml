apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.project }}-postiz
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  destination:
    namespace: {{ .Release.Namespace }}
    server: "https://kubernetes.default.svc"
  project: {{ .Values.project }}
  sources:
    - path: charts/template-single
      repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      helm:
        values: |
          fullnameOverride: postiz

          {{- with .Values.storage }}
          storageclasses:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.domains }}
          domains:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        valueFiles:
          - $values/charts/mordor/postiz.values.yaml
    - repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      ref: values
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postiz-legal-pages
data:
  nginx.conf: |
    pid /var/cache/nginx/nginx.pid;
    error_log /dev/stderr warn;

    events {}

    http {
      include /etc/nginx/mime.types;
      access_log /dev/stdout;

      server {
        listen 8080;
        server_name _;
        server_tokens off;
        charset utf-8;

        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /tos {
          root /usr/share/nginx/html;
          try_files /tos.html =404;
          add_header Cache-Control "public, max-age=3600";
          add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
        }

        location = /privacy {
          root /usr/share/nginx/html;
          try_files /privacy.html =404;
          add_header Cache-Control "public, max-age=3600";
          add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
        }

        location = /healthz {
          access_log off;
          return 204;
        }

        location / {
          return 404;
        }
      }
    }

  tos.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="index,follow">
        <title>Terms of Service | Postiz</title>
        <style>
          :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
          body { margin: 0; background: #f7f7f8; color: #202124; line-height: 1.65; }
          main { box-sizing: border-box; width: min(880px, calc(100% - 32px)); margin: 48px auto; padding: 48px 56px; background: #fff; border: 1px solid #e6e6e8; border-radius: 16px; box-shadow: 0 12px 40px rgba(0, 0, 0, .06); }
          h1 { margin: 0 0 4px; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.15; letter-spacing: -.035em; }
          h2 { margin: 2rem 0 .5rem; font-size: 1.2rem; line-height: 1.3; }
          p, li { font-size: 1rem; }
          .eyebrow { margin: 0 0 12px; color: #6b46c1; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
          .updated { margin: 0 0 2rem; color: #666; }
          a { color: #6941c6; }
          nav { display: flex; gap: 20px; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #e6e6e8; }
          @media (prefers-color-scheme: dark) { body { background: #121214; color: #ececf1; } main { background: #1b1b1f; border-color: #303036; box-shadow: none; } .updated { color: #aaa; } nav { border-color: #303036; } a { color: #b69cff; } }
          @media (max-width: 600px) { main { margin: 0; width: 100%; min-height: 100vh; padding: 32px 22px; border: 0; border-radius: 0; } }
