apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pypi-credentials
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: pypi-credentials
    template:
      engineVersion: v2
      mergePolicy: Merge
      type: Opaque
      data:
        host: {{ printf "pypi.%s" .Values.domains.external | quote }}
  dataFrom:
    - extract:
        key: dynamic/pypi-user-creds
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: pypi-credentials
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: pypi-credentials
  data:
    {{- range $property := list "username" "password" "host" }}
    - match:
        secretKey: {{ $property }}
        remoteRef:
          remoteKey: dynamic/pypi
          property: {{ $property }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pypi-htpasswd
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: pypi-htpasswd
    template:
      engineVersion: v2
      type: Opaque
      data:
        htpasswd: '{{ `{{ htpasswd .USERNAME .PASSWORD "bcrypt" }}` }}'
  data:
    - remoteRef:
        key: dynamic/pypi
        property: username
      secretKey: USERNAME
    - remoteRef:
        key: dynamic/pypi
        property: password
      secretKey: PASSWORD
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pypi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: {{ .Values.storage.nobackup }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pypi
  labels:
    app: pypi
spec:
  selector:
    matchLabels:
      app: pypi
  template:
    metadata:
      labels:
        app: pypi
    spec:
      imagePullSecrets:
        - name: cluster-docker-secrets
      volumes:
        - name: pypidata
          persistentVolumeClaim:
            claimName: pypi
        - name: htppasswd
          secret:
            secretName: pypi-htpasswd
      containers:
        - name: app
          image: {{ tpl .Values.pypi.image.registry . }}{{ .Values.pypi.image.repository }}:{{ .Values.pypi.image.tag }}
          command:
            - pypi-server
          args:
            - run
            # - --disable-fallback
            - --port
            - "8080"
            - --authenticate
            - 'update'
            - --passwords
            - /htpasswd/htpasswd
            - /data/packages
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- with.Values.pypi.resources }}
            requests:
              {{- toYaml . | nindent 14 }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          volumeMounts:
            - name: htppasswd
              mountPath: /htpasswd
            - name: pypidata
              mountPath: /data/packages
---
apiVersion: v1
kind: Service
metadata:
  name: pypi
  labels:
    app: pypi
spec:
  selector:
    app: pypi
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pypi
  namespace: "{{ .Release.Namespace }}"
spec:
  parentRefs:
  - name: gateway
    namespace: system-envoy
    sectionName: https
  hostnames:
  - pypi.{{ .Values.domains.external }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: pypi
      port: 8080
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pypi-web-rps
spec:
  scaleTargetRef:
    name: pypi
    kind: Deployment
  pollingInterval: 10
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.system-monitoring.svc:9090
        metricName: pypi_web_rps_per_pod
        threshold: "75"
        query: |
          sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/{{ .Release.Namespace }}/pypi/.*"}[1m]))
          /
          count(kube_pod_info{namespace="{{ .Release.Namespace }}",pod=~"pypi-.*"})
