apiVersion: v1
kind: Service
metadata:
  name: steam-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: steamheadless
  ports:
    - name: https
      port: 8483
      targetPort: 8483
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: steam
  namespace: "{{ .Release.Namespace }}"
spec:
  parentRefs:
  - name: gateway
    namespace: system-envoy
    sectionName: https
  hostnames:
  - steam.yusufali.ca
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: steam-web-tls
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: steam-web-tls
  namespace: "{{ .Release.Namespace }}"
spec:
  endpoints:
  - fqdn:
      hostname: steam-web.{{ .Release.Namespace }}.svc.cluster.local
      port: 8483
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: steam
  namespace: "{{ .Release.Namespace }}"
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: steam
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 3600s
