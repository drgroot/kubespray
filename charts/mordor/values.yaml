project: lol

storage:
  default: default
  backup: default
  ssd: default

domains:
  internal: example.com
  external: exampe.com

crossplane:
  enabled: true
  iac:
    s3-affine:
      enabled: true
      type: s3
      provider: minio
      name: affine
      vars:
        - key: input
          value: external-infra/vendor/minio
        - key: output
          value: external-infra/iac/s3-affine

    postgres-bitwarden:
      enabled: true
      type: postgres
      provider: db
      name: bitwarden
      vars:
        - key: input
          value: external-infra/iac/postgres
        - key: credentialpath
          value: external-infra/vendor/postgres
        - key: passwordkey
          value: bitwarden
        - key: output
          value: external-infra/iac/postgres-bitwarden
    postgres-memos:
      enabled: true
      type: postgres
      provider: db
      name: memos
      vars:
        - key: input
          value: external-infra/iac/postgres
        - key: credentialpath
          value: external-infra/vendor/postgres
        - key: passwordkey
          value: memos
        - key: output
          value: external-infra/iac/postgres-memos
