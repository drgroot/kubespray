---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: minio-root-user
spec:
  length: 20
  digits: 5
  symbols: 0
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: minio-root-password
spec:
  length: 32
  digits: 5
  symbols: 5
  symbolCharacters: "-_."
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-credentials
spec:
  refreshPolicy: CreatedOnce
  target:
    name: minio-credentials
    creationPolicy: Orphan
    immutable: true
    template:
      type: Opaque
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: minio-root-user
      rewrite:
        - regexp:
            source: "^password$"
            target: rootUser
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: minio-root-password
      rewrite:
        - regexp:
            source: "^password$"
            target: rootPassword
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: minio-root
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: minio-credentials
  template:
    engineVersion: v2
    data:
      root-access-key: {{ "{{ .rootUser }}" | quote }}
      root-secret-key: {{ "{{ .rootPassword }}" | quote }}
      internal-url: {{ printf "http://minio.%s.svc.cluster.local:9000" $.Release.Namespace | quote }}
      endpoint-url: {{ printf "https://s3.%s" $.Values.domains.external | quote }}
      region: us-east-1
  data:
    {{- range $key := list "root-access-key" "root-secret-key" "internal-url" "endpoint-url" "region" }}
    - match:
        secretKey: {{ $key }}
        remoteRef:
          remoteKey: dynamic/minio-root
          property: {{ $key }}
    {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.minio.storage.size }}
  storageClassName: {{ .Values.storage.default }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  annotations:
    secret.reloader.stakater.com/reload: minio-credentials
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: {{ tpl .Values.minio.image.registry . }}{{ .Values.minio.image.repository }}:{{ .Values.versions.minio }}{{ with .Values.minio.image.digest }}@{{ . }}{{ end }}
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
            - name: MINIO_BROWSER_REDIRECT_URL
              value: https://s3-minio.{{ .Values.domains.external }}
            # Silo retains the MINIO_* interface for native OIDC login.
            - name: MINIO_IDENTITY_OPENID_CONFIG_URL
              value: https://auth.{{ .Values.domains.external }}/.well-known/openid-configuration
            - name: MINIO_IDENTITY_OPENID_CLIENT_ID
              value: silo
            - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: silo-oidc
                  key: client-secret
            - name: MINIO_IDENTITY_OPENID_SCOPES
              value: openid,profile,email,groups
            - name: MINIO_IDENTITY_OPENID_REDIRECT_URI
              value: https://s3-minio.{{ .Values.domains.external }}/oauth_callback
            - name: MINIO_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
              value: "off"
            - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
              value: Authelia
            - name: MINIO_IDENTITY_OPENID_CLAIM_NAME
              value: groups
            - name: MINIO_IDENTITY_OPENID_CLAIM_USERINFO
              value: "on"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
          resources:
            {{- with .Values.minio.resources }}
            requests:
              {{- toYaml . | nindent 14 }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-tfstate-bucket
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  labels:
    app: minio
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app: minio
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          # Use the release's bundled mc client for bucket initialization.
          image: {{ tpl .Values.minio.image.registry . }}{{ .Values.minio.image.repository }}:{{ .Values.versions.minio }}{{ with .Values.minio.image.digest }}@{{ . }}{{ end }}
          command:
            - /bin/sh
            - -ec
            - |
              until mc alias set minio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                sleep 2
              done
              mc mb --ignore-existing minio/tfstate
              # Map the Authelia group to bucket browsing and object downloads.
              cat > /tmp/media-admin-policy.json <<'EOF'
              {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:ListAllMyBuckets","s3:GetBucketLocation","s3:ListBucket","s3:ListBucketVersions","s3:GetObject","s3:GetObjectVersion"],"Resource":["arn:aws:s3:::*"]}]}
              EOF
              mc admin policy create minio media-admin /tmp/media-admin-policy.json
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: rootPassword
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: silo-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ .Values.authelia.clients.client_remote_key }}
        property: client-secret-silo
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio
  annotations:
    external-dns.alpha.kubernetes.io/target: mordorhome.{{ .Values.domains.external }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/client-body-buffer-size: 5000m
    nginx.ingress.kubernetes.io/proxy-body-size: 5000m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.{{ .Values.domains.external }}"
      secretName: wildcard-external
  rules:
    - host: s3.{{ .Values.domains.external }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  name: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  annotations:
    external-dns.alpha.kubernetes.io/target: mordorhome.{{ .Values.domains.external }}
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "*.{{ .Values.domains.external }}"
      secretName: wildcard-external
  rules:
    - host: s3-minio.{{ .Values.domains.external }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  name: console
