apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-narrs-romarr-credentials
spec:
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: media-narrs-romarr-credentials
  data:
    - secretKey: ROMARR_API_KEY
      remoteRef:
        key: vendor/selfhosted-app-tokens
        property: romarr-key
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: vendor/selfhosted-app-tokens
        property: prowlarr-key
    - secretKey: SABNZBD_API_KEY
      remoteRef:
        key: iac/sabnzbd
        property: sabnzbd-api-key
