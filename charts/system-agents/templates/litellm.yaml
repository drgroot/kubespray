{{- $host := printf "litellm.%s" .Values.domains.external -}}
{{- $baseURL := printf "https://%s" $host -}}
{{- $issuer := printf "https://auth.%s" .Values.domains.external -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: litellm-secrets
  data:
    - secretKey: OMLX_API_KEY
      remoteRef:
        key: vendor/llm
        property: api-key
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: vendor/llm
        property: secret-key
    - secretKey: GENERIC_CLIENT_SECRET
      remoteRef:
        key: dynamic/authelia-client-creds
        property: client-secret-litellm
    - secretKey: DATABASE_URL
      remoteRef:
        key: dynamic/postgres-app-litellm
        property: url
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-connection
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-secrets
  template:
    engineVersion: v2
    data:
      master-key: {{ `{{ .LITELLM_MASTER_KEY }}` | quote }}
      hostname: {{ $host | quote }}
      url: {{ $baseURL | quote }}
      internal-url: {{ printf "http://litellm.%s.svc.cluster.local:4000" .Release.Namespace | quote }}
  data:
    {{- range $key := list "master-key" "hostname" "url" "internal-url" }}
    - match:
        secretKey: {{ $key }}
        remoteRef:
          remoteKey: dynamic/litellm
          property: {{ $key }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:
      {{- range .Values.litellm.omlx.models }}
      - model_name: {{ .name | quote }}
        litellm_params:
          model: {{ printf "openai/%s" .upstream | quote }}
          api_base: {{ $.Values.litellm.omlx.apiBase | quote }}
          api_key: os.environ/OMLX_API_KEY
        model_info:
          mode: {{ .mode | quote }}
      {{- end }}
    general_settings:
      ui_access_mode: admin_only
      disable_env_credential_login: true
      disable_password_login_when_sso_enabled: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  annotations:
    configmap.reloader.stakater.com/reload: litellm-config
    secret.reloader.stakater.com/reload: litellm-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
    spec:
      automountServiceAccountToken: false
      containers:
        - name: litellm
          image: {{ .Values.litellm.image | quote }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: PROXY_BASE_URL
              value: {{ $baseURL | quote }}
            - name: GENERIC_CLIENT_ID
              value: litellm
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: {{ printf "%s/api/oidc/authorization" $issuer | quote }}
            - name: GENERIC_TOKEN_ENDPOINT
              value: {{ printf "%s/api/oidc/token" $issuer | quote }}
            - name: GENERIC_USERINFO_ENDPOINT
              value: {{ printf "%s/api/oidc/userinfo" $issuer | quote }}
            - name: GENERIC_CLIENT_USE_PKCE
              value: "true"
            - name: GENERIC_SCOPE
              value: openid profile email groups
            - name: GENERIC_USER_ID_ATTRIBUTE
              value: sub
            - name: GENERIC_ROLE_MAPPINGS_GROUP_CLAIM
              value: groups
            - name: GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE
              value: internal_user
            - name: GENERIC_ROLE_MAPPINGS_ROLES
              value: '{"proxy_admin": ["media-admin"]}'
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
spec:
  parentRefs:
    - name: gateway
      namespace: system-envoy
      sectionName: https
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
