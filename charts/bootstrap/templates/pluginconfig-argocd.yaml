apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: client-secret
      remoteRef:
        key: dynamic/authelia-client-creds
        property: client-secret-argocd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  url: https://argocd.{{ .Values.domains.external }}
  admin.enabled: "false"
  oidc.config: |
    name: Authelia
    issuer: https://auth.{{ .Values.domains.external }}
    clientID: argocd
    clientSecret: $argocd-oidc:client-secret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    enableUserInfoGroups: true
    userInfoPath: /api/oidc/userinfo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
data:
  policy.default: role:authenticated
  policy.csv: |
    g, media-admin, role:admin
  scopes: '[groups]'
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: argocd
spec:
  secretName: argocd-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - argocd.{{ .Values.domains.external }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
  - name: gateway
    namespace: system-envoy
    sectionName: https
  hostnames:
  - argocd.{{ .Values.domains.external }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: argocd-server-tls
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: argocd-server-tls
  namespace: argocd
spec:
  endpoints:
  - fqdn:
      hostname: argocd-server.argocd.svc.cluster.local
      port: 443
  tls:
    insecureSkipVerify: true
