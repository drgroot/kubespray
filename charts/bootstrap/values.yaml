project: bootstrap

envoy:
  enabled: true
  version: v1.8.3

crossplane:
  enabled: true
  version: v2.2.1
  opentofuVersion: v1.1.2

vault:
  username: kubernetesadmin
  secretName: vault-password
  key: password
  servc:
    namespace: argocd
    secretName: vault-password
    remoteKey: vendor/vault
    usernameProperty: servc-username
    passwordProperty: servc-password
  image:
    repository: hashicorp/vault
    tag: "1.19.5"
    pullPolicy: IfNotPresent
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 60
      failureThreshold: 3
      periodSeconds: 15
      timeoutSeconds: 5
    readiness:
      failureThreshold: 3
      periodSeconds: 30
      timeoutSeconds: 5

versions:
  argoupdater: 0.18
  ingressnginx: 4.13.2
  externalsecrets: 2.5.0
  nfsprovisioner: 4.0.18
  tailscale: 1.86.5
  keda: 2.17.2
  certmanager: 1.18.2
  externaldns: 1.18.0
  prometheus: 77.3.0
  reloader: 2.2.16

domains:
  internal: k8s.private
  external: yusufali.ca

otherdomains: []

certmanager:
  email: ali@yusuf.email

storageClasses:
  - name: nobackup
    prefix: thorin-
    hostname: 192.168.1.3
    mountPath: /nobackup

  - name: default
    prefix: thorin-
    hostname: 192.168.1.3
    mountPath: /general
    backup:
      enabled: true
      image: dockerhub.yusufali.ca/rclone/rclone:latest
      schedule: "0 0 * * *"
      secretStore:
        name: external-infra
        type: ClusterSecretStore
      rclone:
        remoteRef:
          key: iac/s3-backups-b2
          property: rclone
      ignoreFolders:
        - media/media-downloaders-narr-search-trigger-config
        - mordor/frigate-media

  - name: fast
    prefix: thorin-
    hostname: 192.168.1.3
    mountPath: /ssd-raid0

tenants:
  - name: media
    namespace: media
    createNamespace: true
    permissions:
      - pvc
    sources:
      - name: configs
        url: https://github.com/drgroot/kubespray.git
        path: "charts/media/chart"
      - name: base
        url: https://github.com/drgroot/kubespray.git
        path: "charts/template-multi"
        valuesRepo: https://github.com/drgroot/kubespray.git
        valuesFile: charts/media/values.yaml

  - name: mordor
    namespace: mordor
    createNamespace: true
    permissions:
      - argo
      - pvc
    sources:
      - url: https://github.com/drgroot/kubespray.git
        path: "charts/mordor"

  - name: servc
    namespace: servc
    createNamespace: false
    permissions:
      - argo
      - rbac
      - pvc
      - servc
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
    sources:
      - name: infra
        url: https://git.yusufali.ca/serv-c/servc-charts.git
        path: "servc-helm-aks"
        valuesRepo: https://git.yusufali.ca/serv-c/tenant-charts.git
        valuesFile: "aks/onpremise.yaml"
