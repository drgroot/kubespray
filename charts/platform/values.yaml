domains:
  internal: asd
  external: asd

authelia:
  enabled: true
  database:
    remoteKey: dynamic/postgres-app-authelia

  secrets:
    remoteKey: vendor/selfhosted-app-tokens

  users:
    - name: yusuf
      remoteKey: authelia/yusuf
    - name: salihah
      remoteKey: authelia/salihah
    - name: murtz
      remoteKey: authelia/murtz

  clients:
    client_remote_key: dynamic/authelia-client-creds
    claims_policies:
      openbao:
        id_token:
          - preferred_username
      servc-mcp:
        access_token:
          - email
          - email_verified
    hmac:
      remoteKey: vendor/authelia
      property: hmac-secret
    jwks-private:
      remoteKey: vendor/authelia
      property: jwks-private
    jwks-public:
      remoteKey: vendor/authelia
      property: jwks-public

    list:
      sure:
        client_id: sure
        client_name: Sure
        client_secret_property: client-secret-sure
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://sure.yusufali.ca/auth/openid_connect/callback
          scopes:
            - openid
            - profile
            - email
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic

      postiz:
        client_id: postiz
        client_name: Postiz
        client_secret_property: client-secret-postiz
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: false
          redirect_uris:
            - https://postiz.yusufali.ca/settings
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post

      affine:
        client_id: affine
        client_name: AFFiNE
        client_secret_property: client-secret-affine
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://miro.yusufali.ca/oauth/callback
          scopes:
            - openid
            - profile
            - email
