name: Sync Ansible revisions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ansible-inventory.yml
      - inventory/sample/inventory.ini
      - 'ansible/**'
      - '!ansible/kubespray/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ansible-inventory-revision
  cancel-in-progress: false

jobs:
  update-revision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Pin AnsibleRun to the latest inventory revision
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          INVENTORY_REVISION=$(git log -1 --format=%H -- inventory/sample/inventory.ini ansible ':!ansible/kubespray')
          test -n "$INVENTORY_REVISION"

          sed -i "/^  ansible:$/,/^  [^ ]/s/^    revision: .*/    revision: \"$INVENTORY_REVISION\"/" charts/platform/values.yaml
          grep -Fq "    revision: \"$INVENTORY_REVISION\"" charts/platform/values.yaml
          echo "revision=$INVENTORY_REVISION" >> "$GITHUB_OUTPUT"

      - name: Pin OpenBao AnsibleRuns to the latest playbook revision
        id: openbao
        shell: bash
        run: |
          set -euo pipefail
          OPENBAO_REVISION=$(git log -1 --format=%H -- ansible/openbao-admin.yml ansible/openbao-onpremise.yml)
          test -n "$OPENBAO_REVISION"

          sed -i "/^openbao:$/,/^[^[:space:]]/s/^    revision: .*/    revision: \"$OPENBAO_REVISION\"/" charts/bootstrap/values.yaml
          grep -Fq "    revision: \"$OPENBAO_REVISION\"" charts/bootstrap/values.yaml
          echo "revision=$OPENBAO_REVISION" >> "$GITHUB_OUTPUT"

      # Repository settings must allow GitHub Actions to create pull requests.
      # GitHub may require approval before CI runs on a GITHUB_TOKEN-created PR.
      - name: Open or update Ansible revision pull request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ github.token }}
          base: main
          branch: ansible-inventory-revision
          delete-branch: true
          add-paths: |
            charts/platform/values.yaml
            charts/bootstrap/values.yaml
          commit-message: "chore: pin Ansible configuration revisions"
          title: "chore: update Ansible configuration revisions"
          body: |
            Pin the platform AnsibleRuns to the latest inventory and Ansible configuration revision:
            `${{ steps.inventory.outputs.revision }}`.

            Pin the OpenBao AnsibleRuns to the latest change to `ansible/openbao-admin.yml` or `ansible/openbao-onpremise.yml`:
            `${{ steps.openbao.outputs.revision }}`.

            This update goes through the required pull request checks before it is merged into `main`.
