apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.project }}-bitwarden
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  destination:
    namespace: {{ .Release.Namespace }}
    server: "https://kubernetes.default.svc"
  project: {{ .Values.project }}
  sources:
    - path: charts/template-single
      repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      helm:
        values: |
          fullnameOverride: bitwarden

          {{- with .Values.storage }}
          storageclasses:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.domains }}
          domains:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        valueFiles:
          - $values/charts/mordor/bitwarden.values.yaml
    - repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      ref: values
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bitwarden-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: bitwarden-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        WEBSOCKET_ENABLED: "true"
        INVITATIONS_ALLOWED: "false"
        DOMAIN: https://bitwarden.{{ .Values.domains.external }}
        SMTP_FROM: noreply@yusuf.email
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: vendor/selfhosted-app-tokens
        property: bitwarden-admin-token
    - secretKey: SSO_CLIENT_SECRET
      remoteRef:
        key: dynamic/authelia-client-creds
        property: client-secret-bitwarden
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.project }}-bitwarden
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: gateway
    namespace: system-envoy
    sectionName: https
  hostnames:
  - bitwarden.{{ .Values.domains.external }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: Upgrade
        value: websocket
    backendRefs:
    - name: bitwarden
      port: 80
    name: websocket-0
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: bitwarden
      port: 80
    name: http-0
  - matches:
    - path:
        type: PathPrefix
        value: /notifications/hub
      headers:
      - name: Upgrade
        value: websocket
    backendRefs:
    - name: bitwarden
      port: 3012
    name: websocket-1
  - matches:
    - path:
        type: PathPrefix
        value: /notifications/hub
    backendRefs:
    - name: bitwarden
      port: 3012
    name: http-1
  - matches:
    - path:
        type: PathPrefix
        value: /notifications/hub/negotiate
      headers:
      - name: Upgrade
        value: websocket
    backendRefs:
    - name: bitwarden
      port: 80
    name: websocket-2
  - matches:
    - path:
        type: PathPrefix
        value: /notifications/hub/negotiate
    backendRefs:
    - name: bitwarden
      port: 80
    name: http-2
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Values.project }}-bitwarden
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Values.project }}-bitwarden
    sectionName: http-0
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Values.project }}-bitwarden
    sectionName: http-1
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Values.project }}-bitwarden
    sectionName: http-2
  requestBuffer:
    limit: 10Mi
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 60s
    tcp:
      connectTimeout: 5s
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bitwarden-postgres-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: bitwarden-postgres-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - remoteRef:
        key: dynamic/postgres-app-bitwarden
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: password
    - remoteRef:
        key: dynamic/postgres-app-bitwarden
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: username
    - remoteRef:
        key: dynamic/postgres-app-bitwarden
        property: schema
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: schema
    - remoteRef:
        key: dynamic/postgres-app-bitwarden
        property: hostname
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: hostname
    - remoteRef:
        key: dynamic/postgres-app-bitwarden
        property: url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: url
    - remoteRef:
        key: dynamic/postgres-app-bitwarden
        property: database
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
      secretKey: database
---
