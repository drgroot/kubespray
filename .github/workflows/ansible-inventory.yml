name: Sync Ansible inventory revision

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ansible-inventory.yml
      - inventory/sample/inventory.ini
      - 'ansible/**'
      - '!ansible/kubespray/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ansible-inventory-revision
  cancel-in-progress: false

jobs:
  update-revision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Pin AnsibleRun to the latest inventory revision
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          INVENTORY_REVISION=$(git log -1 --format=%H -- inventory/sample/inventory.ini ansible ':!ansible/kubespray')
          test -n "$INVENTORY_REVISION"

          sed -i "/^  ansible:$/,/^  [^ ]/s/^    revision: .*/    revision: \"$INVENTORY_REVISION\"/" charts/platform/values.yaml
          grep -Fq "    revision: \"$INVENTORY_REVISION\"" charts/platform/values.yaml
          echo "revision=$INVENTORY_REVISION" >> "$GITHUB_OUTPUT"

      # Repository settings must allow GitHub Actions to create pull requests.
      # GitHub may require approval before CI runs on a GITHUB_TOKEN-created PR.
      - name: Open or update inventory revision pull request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ github.token }}
          base: main
          branch: ansible-inventory-revision
          delete-branch: true
          add-paths: charts/platform/values.yaml
          commit-message: "chore: pin Ansible inventory to ${{ steps.inventory.outputs.revision }}"
          title: "chore: update Ansible inventory revision"
          body: |
            Pin Crossplane's AnsibleRun to the latest inventory and Ansible configuration revision:
            `${{ steps.inventory.outputs.revision }}`.

            This update goes through the required pull request checks before it is merged into `main`.
