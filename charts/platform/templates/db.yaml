apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: db
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  destination:
    namespace: {{ .Release.Namespace }}
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    path: charts/postgres
    repoURL: https://github.com/drgroot/kubespray.git
    targetRevision: main
    helm:
      releaseName: db
      values: |-
        fullnameOverride: db

        storageclass: {{ .Values.storage.fast }}

        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"

        secrets:
          secretStore:
            name: external-infra
            type: ClusterSecretStore
          username:
            remoteRef:
              key: vendor/postgres
              property: root-username
          password:
            remoteRef:
              key: vendor/postgres
              property: root-password
          pushsecret:
            enabled: true
            secretStore:
              name: external-infra
              type: ClusterSecretStore
            remoteKey: iac/postgres

        backup:
          secretStore:
            name: external-infra
            type: ClusterSecretStore
          rclone:
            remoteRef:
              key: iac/s3-db-backups
              property: rclone
