apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport-proxy
  namespace: system-envoy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyService:
        type: LoadBalancer
        loadBalancerClass: kube-vip.io/kube-vip-class
        externalTrafficPolicy: Cluster
        annotations:
          kube-vip.io/loadbalancerIPs: {{ .Values.gateway.virtualIP | quote }}
      envoyDaemonSet:
        container:
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              add:
                - NET_BIND_SERVICE
        strategy:
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-nodeport
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nodeport-proxy
    namespace: system-envoy
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: system-envoy
  annotations:
    external-dns.alpha.kubernetes.io/target: "mordorhome.{{ .Values.domains.external }}"
spec:
  gatewayClassName: envoy-nodeport

  listeners:
    {{- range $port := list 27036 27037 }}
    - name: steam-remote-play-tcp-{{ $port }}
      protocol: TCP
      port: {{ $port }}
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
    {{- end }}
    {{- range $port := list 27031 27036 }}
    - name: steam-remote-play-udp-{{ $port }}
      protocol: UDP
      port: {{ $port }}
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
    {{- end }}
    {{- range $port := list 47984 47989 48010 }}
    - name: sunshine-tcp-{{ $port }}
      protocol: TCP
      port: {{ $port }}
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
    {{- end }}
    {{- range $port := list 47998 47999 48000 }}
    - name: sunshine-udp-{{ $port }}
      protocol: UDP
      port: {{ $port }}
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
    {{- end }}

    - name: frigate-rtsp
      protocol: TCP
      port: 8554
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All

    - name: frigate-webrtc-tcp
      protocol: TCP
      port: 8555
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All

    - name: frigate-webrtc-udp
      protocol: UDP
      port: 8555
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: All

    - name: syncthing-tcptransfer
      protocol: TCP
      port: 22000
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All

    - name: syncthing-quic
      protocol: UDP
      port: 22000
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: All

    - name: syncthing-discovery
      protocol: UDP
      port: 21027
      allowedRoutes:
        kinds:
          - kind: UDPRoute
        namespaces:
          from: All

    - name: postgres
      protocol: TCP
      port: 5432
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: gateway-tls
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: All

    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: postgres
  namespace: system-envoy
spec:
  parentRefs:
    - name: gateway
      sectionName: postgres
  rules:
    - backendRefs:
        - name: db
          namespace: kube-platform
          port: 5432
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: postgres-gateway
  namespace: kube-platform
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: system-envoy
  to:
    - group: ""
      kind: Service
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gateway-tls
  namespace: system-envoy
spec:
  secretName: gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - {{ .Values.domains.external | quote }}
    - "*.{{ .Values.domains.external }}"
    {{- if .Values.coder.enabled }}
    - "*.{{ tpl .Values.coder.route.domain . }}"
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: system-envoy
spec:
  parentRefs:
    - name: gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: http-defaults
  namespace: system-envoy
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 60s
    tcp:
      connectTimeout: 5s
