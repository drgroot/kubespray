gitea:
  actions:
    version: 0.1.2
    maxRunners: 5

    resources:
      requests:
        memory: "2Gi"
        cpu: "1"
      limits:
        memory: "4Gi"
        cpu: "2"

secretSync:
  - name: authelia-oidc-clients
    input:
      kind: ClusterSecretStore
      name: vault
      path: dynamic/authelia-client-creds
      properties:
        - client-secret-argocd
        - client-secret-grafana
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/authelia
      properties:
        client-secret-argocd: client-secret-argocd
        client-secret-grafana: client-secret-grafana

  - name: gitea
    refreshInterval: 1m
    input:
      kind: ClusterSecretStore
      name: vault
      path: dynamic/gitea-chintan
      properties:
        - username
        - password
        - token
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/gitea
      properties:
        username: username
        password: password
        token: token

  - name: docker
    input:
      kind: ClusterSecretStore
      name: vault
      path: vendor/docker
      properties:
        - private-host
        - private-username
        - private-password
      data:
        - secretKey: host-mirror
          remoteRef:
            key: dynamic/docker-mirror
            property: hostname
        - secretKey: mirror-username
          remoteRef:
            key: dynamic/docker-mirror
            property: username
        - secretKey: mirror-password
          remoteRef:
            key: dynamic/docker-mirror
            property: password
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/docker
      properties:
        private-host: host
        private-username: username
        private-password: password
        host-mirror: host-mirror
        mirror-username: mirror-username
        mirror-password: mirror-password

  - name: npm
    input:
      kind: ClusterSecretStore
      name: vault
      path: dynamic/npm
      properties:
        - host
        - password
        - username
        - read-username
        - read-password
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/npm
      properties:
        host: host
        password: npm_write_pass
        username: npm_write_user
        read-username: npm_read_user
        read-password: npm_read_pass

  - name: pip
    input:
      kind: ClusterSecretStore
      name: vault
      path: dynamic/pypi
      properties:
        - host
        - password
        - username
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/pip
      properties:
        host: url
        password: token
        username: username

  - name: coder-postgres
    input:
      kind: ClusterSecretStore
      name: vault
      path: dynamic/postgres-app-coder
      properties:
        - url
    output:
      kind: ClusterSecretStore
      name: servc
      path: nonprod/coder-postgres-secret
      properties:
        url: onprem-url

  - name: vault
    input:
      kind: ClusterSecretStore
      name: vault
      path: dynamic/vault-user-servc
      properties:
        - username
        - password
        - token
        - vault-addr
    output:
      kind: ClusterSecretStore
      name: servc
      path: iac/vault
      properties:
        username: username
        password: password
        vault-addr: vault-addr
        token: vault-token
