image: postgres:16.3
imagePullSecrets: []
database: postgres

nameOverride: ""
fullnameOverride: ""

annotations: {}

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "250m"
    memory: "512Mi"

storageclass: nfs-thorin-ssd-raid0

# Optional direct volume source for the Postgres data volume. When set, the
# data PVC is not created. The value must be a Kubernetes volume source, for
# example:
# volume:
#   iscsi:
#     fsType: ext4
#     iqn: iqn.2026-01.com.middleearth:thorin
#     iscsiInterface: default
#     lun: 1
#     targetPortal: 192.168.1.3:3260
volume: {}

secrets:
  secretStore:
    name: external-infra
    type: ClusterSecretStore
  username:
    remoteRef:
      key: vendor/postgres
      property: username-key
  password:
    remoteRef:
      key: vendor/postgres
      property: password-key

  pushsecret:
    enabled: true
    secretStore:
      name: external-infra
      type: ClusterSecretStore
    remoteKey: iac/postgres

backup:
  image: rclone/rclone:latest
  schedule: "0 0 * * *"
  secretStore:
    name: external-infra
    type: ClusterSecretStore
  rclone:
    remoteRef:
      key: iac/s3-backups
      property: rclone
