apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: {{ .Values.versions.prometheus }}
    helm:
      releaseName: prometheus
      values: |-
        namespaceOverride: monitoring
        alertmanager:
          enabled: false

        grafana:
          enabled: true

          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: client-secret

          grafana.ini:
            auth:
              disable_login_form: true
              oauth_auto_login: true
            auth.basic:
              enabled: false
            auth.generic_oauth:
              enabled: true
              name: Authelia
              allow_sign_up: true
              client_id: grafana
              scopes: openid profile email groups
              auth_url: https://auth.yusufali.ca/api/oidc/authorization
              token_url: https://auth.yusufali.ca/api/oidc/token
              api_url: https://auth.yusufali.ca/api/oidc/userinfo
              use_pkce: true
              groups_attribute_path: groups
              allowed_groups: media-admin

          serviceMonitor:
            namespace: monitoring

          persistence:
            enabled: false

          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
              external-dns.alpha.kubernetes.io/target: "mordorhome.{{ .Values.domains.external }}"
            hosts:
              - grafana.{{ .Values.domains.external }}
            tls:
              - secretName: grafana-general-tls
                hosts:
                  - grafana.{{ .Values.domains.external }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: client-secret
      remoteRef:
        key: vendor/authelia-apps
        property: client-secret-grafana
