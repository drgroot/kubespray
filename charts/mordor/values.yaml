project: lol

storage:
  default: default
  backup: default
  ssd: default

domains:
  internal: example.com
  external: exampe.com

crossplane:
  enabled: true
  iac:
    s3-postiz:
      enabled: true
      type: s3
      provider: cloudflare
      name: postiz
      vars:
        - key: input
          value: onprem/vendor/cloudflare
        - key: output
          value: onprem/dynamic/s3-postiz

    s3-affine:
      enabled: true
      type: s3
      provider: minio
      name: affine
      vars:
        - key: input
          value: onprem/dynamic/minio-root
        - key: output
          value: onprem/dynamic/s3-affine

    s3-sure:
      enabled: true
      type: s3
      provider: minio
      name: sure
      vars:
        - key: input
          value: onprem/dynamic/minio-root
        - key: output
          value: onprem/dynamic/s3-sure

    postgres-sure:
      enabled: true
      type: postgres
      provider: db
      name: sure
      vars:
        - key: input
          value: onprem/dynamic/postgres
        - key: credentialpath
          value: onprem/dynamic/postgres-app-creds
        - key: passwordkey
          value: sure
        - key: output
          value: onprem/dynamic/postgres-app-sure

    postgres-bitwarden:
      enabled: true
      type: postgres
      provider: db
      name: bitwarden
      vars:
        - key: input
          value: onprem/dynamic/postgres
        - key: credentialpath
          value: onprem/dynamic/postgres-app-creds
        - key: passwordkey
          value: bitwarden
        - key: output
          value: onprem/dynamic/postgres-app-bitwarden

    postgres-postiz:
      enabled: true
      type: postgres
      provider: db
      name: postiz
      vars:
        - key: input
          value: onprem/dynamic/postgres
        - key: credentialpath
          value: onprem/dynamic/postgres-app-creds
        - key: passwordkey
          value: postiz
        - key: output
          value: onprem/dynamic/postgres-app-postiz
    postgres-postiz-temporal:
      enabled: true
      type: postgres
      provider: db
      name: postiz-temporal
      vars:
        - key: input
          value: onprem/dynamic/postgres
        - key: credentialpath
          value: onprem/dynamic/postgres-app-creds
        - key: passwordkey
          value: postiz-temporal
        - key: output
          value: onprem/dynamic/postgres-app-postiz-temporal
