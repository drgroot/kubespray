image:
  name: dockerhub.yusufali.ca/gtstef/filebrowser
  tag: 2.1.0-stable

strategy:
  type: Recreate

deploymentAnnotations:
  secret.reloader.stakater.com/reload: filebrowser-config

imagePullSecrets:
  - name: cluster-docker-secrets

ports:
  - name: web
    containerPort: 80

service:
  port: 80
  ports:
    - port: 80
      targetPort: web
      protocol: TCP
      name: web

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 200m
    memory: 1Gi

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 0

volumeMounts:
  - name: storage
    mountPath: /home/filebrowser/data
    subPath: quantum-data
  - name: filebrowser-config
    mountPath: /home/filebrowser/data/config.yaml
    subPath: config.yaml
    readOnly: true
  - name: storage
    mountPath: /srv
    subPath: data
  - name: social-media
    mountPath: /srv/users/yusuf/social_media
  - name: syncthing
    mountPath: /srv/users/yusuf/syncthing
    subPath: documents

volumes:
  - name: syncthing
    persistentVolumeClaim:
      claimName: syncthing-pvc
  - name: social-media
    nfs:
      server: 192.168.1.3
      path: /nobackup/models/social_media
  - name: filebrowser-config
    secret:
      secretName: filebrowser-config
      items:
        - key: config.yaml
          path: config.yaml

pvc:
  enabled: true
  name: storage
  storageClass: thorin-default

route:
  enabled: true
  hosts:
  - host: drive.yusufali.ca
    paths:
    - path: /
      pathType: Prefix
  bodyLimit: 512Mi
probes:
  startupProbe:
    httpGet:
      path: /health
      port: 80
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
