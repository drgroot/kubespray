---
- name: Reconcile ASUS router port forwards
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Apply the desired port forwarding table
      asusrouter_port_forwards:
        hostname: "{{ lookup('ansible.builtin.env', 'ROUTER_IP') }}"
        port: "{{ router.port | default(80) }}"
        use_ssl: "{{ router.useSSL | default(false) }}"
        enabled: "{{ router.forwardingEnabled | default(true) }}"
        username: "{{ lookup('ansible.builtin.env', 'ROUTER_USERNAME') }}"
        password: "{{ lookup('ansible.builtin.env', 'ROUTER_PASSWORD') }}"
        port_forwards: "{{ router.portForwards }}"
      no_log: true
