apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-downloaders-deluge-vpn
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: media-downloaders-deluge-vpn
    template:
      engineVersion: v2
      data:
        VPN_SERVICE_PROVIDER: '{{ `{{ .VPN_SERVICE_PROVIDER }}` }}'
        OPENVPN_USER: '{{ `{{ .OPENVPN_USER }}` }}'
        OPENVPN_PASSWORD: '{{ `{{ .OPENVPN_PASSWORD }}` }}'
        # Privado publishes cities (e.g. Atlanta), with no region metadata.
        # Preserve the vault's SERVER_REGIONS key and adapt it for Gluetun.
        SERVER_REGIONS: '{{ `{{ if ne .VPN_SERVICE_PROVIDER "privado" }}{{ .SERVER_REGIONS }}{{ end }}` }}'
        SERVER_CITIES: '{{ `{{ if eq .VPN_SERVICE_PROVIDER "privado" }}{{ .SERVER_REGIONS }}{{ end }}` }}'
  data:
    - secretKey: VPN_SERVICE_PROVIDER
      remoteRef:
        key: vendor/sabnzbd
        property: VPN_SERVICE_PROVIDER
    - secretKey: SERVER_REGIONS
      remoteRef:
        key: vendor/sabnzbd
        property: SERVER_REGIONS
    - secretKey: OPENVPN_USER
      remoteRef:
        key: vendor/sabnzbd
        property: OPENVPN_USER
    - secretKey: OPENVPN_PASSWORD
      remoteRef:
        key: vendor/sabnzbd
        property: OPENVPN_PASSWORD
