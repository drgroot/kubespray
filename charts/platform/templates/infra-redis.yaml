apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: redis-credentials
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: platform-fake-secret
  template:
    engineVersion: v2
    data:
      port: "6379"
      hostname: redis.{{ .Release.Namespace }}.svc.cluster.local
      url: "redis://redis.{{ .Release.Namespace }}.svc.cluster.local:6379"
  data:
    - match:
        secretKey: port
        remoteRef:
          remoteKey: dynamic/redis
          property: port
    - match:
        secretKey: hostname
        remoteRef:
          remoteKey: dynamic/redis
          property: hostname
    - match:
        secretKey: url
        remoteRef:
          remoteKey: dynamic/redis
          property: url
    - match:
        secretKey: url
        remoteRef:
          remoteKey: dynamic/redis
          property: CACHE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      imagePullSecrets:
        - name: cluster-docker-secrets
      containers:
        - name: app
          image: {{ .Values.redis.image.registry }}{{ .Values.redis.image.repository }}:{{ .Values.versions.redis }}
          ports:
            - containerPort: 6379
          args:
            - "--maxmemory-policy"
            - "allkeys-lru"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - PING
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- with.Values.redis.resources }}
            requests:
              {{- toYaml . | nindent 14 }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
