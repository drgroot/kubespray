apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-external-externalsecrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    namespace: system-eso
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: {{ .Values.versions.externalsecrets }}
    helm:
      releaseName: externalsecrets
      values: |-
        installCRDs: true

        prometheus:
          enabled: false
---
