{{- if and .Values.openbaoOperator.enabled .Values.openbao.enabled }}
{{- if and .Values.openbao.createNamespace (ne .Values.openbao.namespace .Values.openbaoOperator.namespace) (not (hasPrefix "kube-" .Values.openbao.namespace)) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.openbao.namespace }}
  labels:
    tenant: approved
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
---
{{- end }}
apiVersion: openbao.org/v1alpha1
kind: OpenBaoTenant
metadata:
  name: {{ .Values.openbao.name }}
  namespace: {{ .Values.openbao.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  targetNamespace: {{ .Values.openbao.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.openbao.admin.serviceAccountName }}
  namespace: {{ .Values.openbao.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: openbao.org/v1alpha1
kind: OpenBaoCluster
metadata:
  name: {{ .Values.openbao.name }}
  namespace: {{ .Values.openbao.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  version: {{ .Values.versions.openbao | quote }}
  replicas: {{ .Values.openbao.replicas }}
  # Static auto-unseal and operator-managed TLS require the Development profile.
  profile: Development
  controllerJWTMode: Target
  deletionPolicy: Retain
  storage:
    size: {{ .Values.openbao.storage.size | quote }}
    storageClassName: {{ .Values.openbao.storage.storageClassName | quote }}
  resources:
    {{- toYaml .Values.openbao.resources | nindent 4 }}
  configuration:
    ui: true
  service:
    type: ClusterIP
  tls:
    enabled: true
    mode: OperatorManaged
    rotationPeriod: "720h"
    extraSANs:
      - {{ printf "%s-public.%s.svc" .Values.openbao.name .Values.openbao.namespace | quote }}
  network:
    apiServerEndpointIPs:
      - 192.168.1.10
    dnsEndpointIPs:   
    # cat /etc/resolv.conf from inside pod, k8s dns
      - 169.254.25.10
    trustedIngressPeers:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: system-networking
        podSelector:
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
            app.kubernetes.io/component: controller
    ingressRules:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: system-eso
            podSelector:
              matchLabels:
                app.kubernetes.io/name: external-secrets
        ports:
          - protocol: TCP
            port: 8200
    {{- if .Values.crossplane.enabled }}
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: system-crossplane
            podSelector:
              matchLabels:
                app.kubernetes.io/name: provider-ansible
        ports:
          - protocol: TCP
            port: 8200
    {{- end }}
  unseal:
    type: static
  selfInit:
    enabled: true
    oidc:
      enabled: true
    # Bootstrap access before self-init revokes the initial root token.
    requests:
      - name: enable-kv
        operation: update
        path: sys/mounts/secret
        secretEngine:
          type: kv
          options:
            version: "2"
      - name: enable-onprem-kv
        operation: update
        path: sys/mounts/onprem
        secretEngine:
          type: kv
          options:
            version: "2"
      - name: create-admin-policy
        operation: update
        path: sys/policies/acl/openbao-admin
        policy:
          policy: |
            path "*" {
              capabilities = ["create", "read", "update", "delete", "list", "patch", "sudo"]
            }
      - name: create-admin-role
        operation: update
        path: auth/jwt-operator/role/openbao-admin
        data:
          role_type: jwt
          user_claim: sub
          bound_audiences:
            - {{ .Values.openbao.admin.audience | quote }}
          bound_subject: {{ printf "system:serviceaccount:%s:%s" .Values.openbao.namespace .Values.openbao.admin.serviceAccountName | quote }}
          token_policies:
            - openbao-admin
          token_ttl: 15m
          token_max_ttl: 1h
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.openbao.name }}
  namespace: {{ .Values.openbao.namespace }}
spec:
  provider:
    vault:
      server: {{ printf "https://%s-public.%s.svc:8200" .Values.openbao.name .Values.openbao.namespace | quote }}
      path: onprem
      version: v2
      caProvider:
        type: Secret
        name: {{ .Values.openbao.name }}-tls-server
        key: ca.crt
      auth:
        jwt:
          path: jwt-operator
          role: openbao-admin
          kubernetesServiceAccountToken:
            serviceAccountRef:
              name: {{ .Values.openbao.admin.serviceAccountName }}
              audiences:
                - {{ .Values.openbao.admin.audience | quote }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.openbao.name }}-external
  namespace: {{ .Values.openbao.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/target: mordorhome.{{ .Values.domains.external }}
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: openbao.{{ .Values.domains.external }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.openbao.name }}-public
                port:
                  number: 8200
  tls:
    - hosts:
        - openbao.{{ .Values.domains.external }}
      secretName: openbao-external-tls
---
{{- $name := printf "%s-admin-credentials" .Values.openbao.name }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ $name }}
  namespace: {{ .Values.openbao.namespace }}
spec:
  length: 32
  digits: 5
  symbols: 5
  # OpenBao custom token IDs cannot contain dots.
  symbolCharacters: "!@#$%^&*()-_=+[]"
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.openbao.namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ $name }}
    creationPolicy: Orphan
    immutable: true
    template:
      type: Opaque
      data:
        username: openbao-admin
        password: {{ "{{ .password }}" | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ $name }}
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.openbao.namespace }}
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: {{ .Values.openbao.name }}
      kind: SecretStore
  selector:
    secret:
      name: {{ $name }}
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: dynamic/vault-root
          property: username
    - match:
        secretKey: password
        remoteRef:
          remoteKey: dynamic/vault-root
          property: password
{{- if .Values.crossplane.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.openbao.name }}-admin-token-request
  namespace: {{ .Values.openbao.namespace }}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [{{ .Values.openbao.admin.serviceAccountName | quote }}]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.openbao.name }}-admin-token-request
  namespace: {{ .Values.openbao.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.openbao.name }}-admin-token-request
subjects:
  - kind: ServiceAccount
    name: provider-ansible
    namespace: system-crossplane
---
apiVersion: ansible.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: {{ .Values.openbao.namespace }}-{{ .Values.openbao.name }}-admin
spec:
  credentials:
    {{- range $key := list "username" "password" }}
    - filename: {{ $key }}
      source: Secret
      secretRef:
        namespace: {{ $.Values.openbao.namespace | quote }}
        name: {{ $name }}
        key: {{ $key }}
    {{- end }}
    - filename: openbao-ca.crt
      source: Secret
      secretRef:
        namespace: {{ .Values.openbao.namespace | quote }}
        name: {{ .Values.openbao.name }}-tls-server
        key: ca.crt
---
apiVersion: ansible.crossplane.io/v1alpha1
kind: AnsibleRun
metadata:
  name: {{ .Values.openbao.namespace }}-{{ .Values.openbao.name }}-admin
  annotations:
    # Check mode compares the live Secret hash; credential file changes alone
    # do not trigger ObserveAndDelete runs in provider-ansible.
    ansible.crossplane.io/runPolicy: CheckWhenObserve
spec:
  deletionPolicy: Orphan
  providerConfigRef:
    name: {{ .Values.openbao.namespace }}-{{ .Values.openbao.name }}-admin
  forProvider:
    inventoryInline: |
      localhost ansible_connection=local
    vars:
      openbao_address: {{ printf "https://%s-public.%s.svc:8200" .Values.openbao.name .Values.openbao.namespace | quote }}
      openbao_namespace: {{ .Values.openbao.namespace | quote }}
      openbao_service_account: {{ .Values.openbao.admin.serviceAccountName | quote }}
      openbao_audience: {{ .Values.openbao.admin.audience | quote }}
    playbookInline: |
      - name: Run OpenBao admin configuration from the repository
        hosts: localhost
        connection: local
        gather_facts: false
        vars:
          ansible_python_interpreter: "{{ `{{ ansible_playbook_python }}` }}"
        tasks:
          - name: Check out the configuration repository
            ansible.builtin.git:
              repo: https://github.com/drgroot/kubespray.git
              dest: "{{ `{{ playbook_dir }}` }}/repository"
              version: {{ .Values.openbao.ansible.revision | quote }}
              recursive: false
            check_mode: false
            changed_when: false

          - name: Reconcile the OpenBao admin token
            ansible.builtin.command:
              argv: "{{ `{{ ['ansible-playbook', '--inventory', 'localhost,', 'ansible/openbao-admin.yml', '--extra-vars', {'openbao_address': openbao_address, 'openbao_namespace': openbao_namespace, 'openbao_service_account': openbao_service_account, 'openbao_audience': openbao_audience, 'openbao_credentials_dir': playbook_dir} | to_json] + (['--check'] if ansible_check_mode else []) }}` }}"
              chdir: "{{ `{{ playbook_dir }}` }}/repository"
            environment:
              ANSIBLE_STDOUT_CALLBACK: default
              ANSIBLE_NOCOLOR: "1"
            register: openbao_run
            check_mode: false
            changed_when: "{{ `openbao_run.stdout is search('changed=[1-9][0-9]*')` }}"
            no_log: true
{{- end }}
{{- end }}
