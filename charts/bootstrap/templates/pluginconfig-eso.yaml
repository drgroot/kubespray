{{- if and .Values.openbaoOperator.enabled .Values.openbao.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: {{ printf "https://%s-public.%s.svc:8200" .Values.openbao.name .Values.openbao.namespace | quote }}
      path: onprem
      version: v2
      caProvider:
        type: Secret
        namespace: {{ .Values.openbao.namespace }}
        name: {{ .Values.openbao.name }}-tls-server
        key: ca.crt
      auth:
        userPass:
          path: userpass
          username: onpremise
          secretRef:
            namespace: {{ .Values.openbao.namespace }}
            name: {{ .Values.openbao.name }}-onpremise-credentials
            key: password
{{- end }}
