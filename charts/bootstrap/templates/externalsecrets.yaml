apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-external-externalsecrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  destination:
    namespace: kube-externalsecrets
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    targetRevision: {{ .Values.versions.externalsecrets }}
    helm:
      releaseName: externalsecrets
      values: |-
        installCRDs: true

        prometheus:
          enabled: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: external-infra
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: http://vault.{{ .Release.Namespace }}.svc.cluster.local:8200
      path: external-infra
      version: "v2"
      auth:
        userPass:
          path: "userpass"
          username: {{ .Values.vault.username }}
          secretRef:
            name: {{ .Values.vault.secretName }}
            key: {{ .Values.vault.key }}
            namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.vault.servc.secretName }}
  namespace: {{ .Values.vault.servc.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: {{ .Values.vault.servc.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.vault.servc.remoteKey }}
        property: {{ .Values.vault.servc.tokenProperty }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: servc
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  provider:
    vault:
      server: http://vault.{{ .Release.Namespace }}.svc.cluster.local:8200
      path: servc
      version: "v2"
      auth:
        tokenSecretRef:
          name: {{ .Values.vault.servc.secretName }}
          key: token
          namespace: {{ .Values.vault.servc.namespace }}
