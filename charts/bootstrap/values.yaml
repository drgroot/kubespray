project: bootstrap

versions:
  nvidia: v25.3.2
  envoy: v1.9.2
  crossplane: v2.4.2
  crossplaneOpenTofu: v1.1.9
  crossplaneAnsible: v0.8.0
  argoupdater: 0.18
  ingressnginx: 4.13.2
  externalsecrets: 2.11.0
  nfsprovisioner: 4.0.18
  keda: 2.21.0
  certmanager: 1.21.2
  externaldns: 1.21.1
  prometheus: 77.3.0
  reloader: 2.2.16

nvidia:
  enabled: true
  namespace: gpu-operator
  driver:
    # Disable if NVIDIA drivers are already installed on the hosts.
    enabled: true
    version: "580.126.09"
  timeSlicing:
    # Set nvidia.enabled and this flag to true to share each GPU across pods.
    # Shares do not provide GPU memory or fault isolation (unlike MIG).
    enabled: false
    # Number of advertised shares per physical GPU on all GPU nodes.
    replicas: 4
    # When true, pods must request nvidia.com/gpu.shared instead of nvidia.com/gpu.
    renameByDefault: false
    # Multiple shares do not guarantee proportionally more GPU time.
    failRequestsGreaterThanOne: true

envoy:
  enabled: true

crossplane:
  enabled: true
  # Docker config secret available in the system-crossplane namespace.
  opentofuOciAuthSecretName: cluster-docker-secrets

vault:
  username: kubernetesadmin
  secretName: vault-password
  key: password
  servc:
    namespace: argocd
    secretName: vault-servc-token
    remoteKey: iac/vault-user-servc
    tokenProperty: token
  image:
    repository: hashicorp/vault
    tag: "1.19.5"
    pullPolicy: IfNotPresent
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 5
    liveness:
      initialDelaySeconds: 60
      failureThreshold: 3
      periodSeconds: 15
      timeoutSeconds: 5
    readiness:
      failureThreshold: 3
      periodSeconds: 30
      timeoutSeconds: 5

domains:
  internal: k8s.private
  external: yusufali.ca

otherdomains: []

certmanager:
  email: ali@yusuf.email

storageClasses:
  - name: nobackup
    prefix: thorin-
    hostname: 192.168.1.3
    mountPath: /nobackup

  - name: default
    prefix: thorin-
    hostname: 192.168.1.3
    mountPath: /general
    backup:
      enabled: true
      image: dockerhub.yusufali.ca/rclone/rclone:latest
      schedule: "0 0 * * *"
      secretStore:
        name: external-infra
        type: ClusterSecretStore
      rclone:
        remoteRef:
          key: iac/s3-backups-b2
          property: rclone
      ignoreFolders:
        - media/media-downloaders-narr-search-trigger-config
        - mordor/frigate-media

  - name: fast
    prefix: thorin-
    hostname: 192.168.1.3
    mountPath: /ssd-raid0

tenants:
  - name: media
    namespace: media
    createNamespace: true
    permissions:
      - pvc
    updater:
      - name: radarr
        image: linuxserver/radarr:latest
        updateStrategy: digest
        helmImageName: components.narrs.list.radarr.image.name
        helmImageVersion: components.narrs.list.radarr.image.tag
      - name: sonarr
        image: linuxserver/sonarr:latest
        updateStrategy: digest
        helmImageName: components.narrs.list.sonarr.image.name
        helmImageVersion: components.narrs.list.sonarr.image.tag
      - name: plex
        image: plexinc/pms-docker:latest
        updateStrategy: digest
        helmImageName: components.media.list.plex.image.name
        helmImageVersion: components.media.list.plex.image.tag
      - name: prowlarr
        image: linuxserver/prowlarr:latest
        updateStrategy: digest
        helmImageName: components.narrs.list.prowlarr.image.name
        helmImageVersion: components.narrs.list.prowlarr.image.tag
    sources:
      # Image Updater targets the first Helm source.
      - name: base
        url: https://github.com/drgroot/kubespray.git
        path: "charts/template-multi"
        valuesRepo: https://github.com/drgroot/kubespray.git
        valuesFile: charts/media/values.yaml
      - name: configs
        url: https://github.com/drgroot/kubespray.git
        path: "charts/media/chart"

  - name: mordor
    namespace: mordor
    createNamespace: true
    permissions:
      - argo
      - pvc
    sources:
      - url: https://github.com/drgroot/kubespray.git
        path: "charts/mordor"

  - name: servc
    namespace: servc
    createNamespace: false
    permissions:
      - argo
      - rbac
      - pvc
      - servc
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
    sources:
      - name: infra
        url: https://git.yusufali.ca/serv-c/servc-charts.git
        path: "servc-helm-aks"
        valuesRepo: https://git.yusufali.ca/serv-c/tenant-charts.git
        valuesFile: "aks/onpremise.yaml"

# Prometheus buffers recent data on a PVC; Thanos uploads blocks to MinIO.
# Bucket and scoped credentials are provisioned by platform.crossplane.iac.s3-thanos.
# One compactor owns this bucket; retain recent detail and longer-term trends.
prometheus:
  namespace: monitoring
  thanos:
    enabled: true
    image:
      repository: quay.io/thanos/thanos
      tag: v0.42.4
    prometheus:
      retention: 24h
      storage:
        size: 20Gi
        storageClassName: thorin-fast
    s3:
      secretStore:
        name: external-infra
        kind: ClusterSecretStore
      remoteRef:
        key: iac/s3-thanos
      properties:
        bucket: bucket
        endpoint: blob-url
        region: region
        accessKey: accesskey
        secretKey: secretkey
    query:
      replicas: 2
      resources: {}
      affinity: {}
      tolerations: []
    store:
      replicas: 1
      resources: {}
      affinity: {}
      tolerations: []
      storage:
        type: emptyDir
        emptyDir: {}
        size: 10Gi
        storageClassName: thorin-fast
    compactor:
      resources: {}
      affinity: {}
      tolerations: []
      storage:
        type: pvc
        emptyDir: {}
        size: 20Gi
        storageClassName: thorin-fast
      retention:
        raw: 30d
        fiveMinutes: 60d
        oneHour: 90d
