project: boasdasdotstrap

storage:
  default: asdasd
  nobackup: asdasd
  fast: asdasd

versions:
  authelia: 0.11.20
  gitea: 12.7.0

actionsVerions:
  python: 3.13
  terraform: 1.6.3
  vault: v2
  helm: 3.10.3
  kubelogin: v0.0.18
  kubectl: v1.24.6

crossplane:
  enabled: true
  iac:
    vault-user-servc:
      enabled: true
      type: vault
      provider: user
      name: vault-user-servc
      vars:
        - key: input
          value: external-infra/vendor/vault
        - key: output
          value: external-infra/iac/vault-user-servc
        - key: usernamekey
          value: servc-username
        - key: passwordkey
          value: servc-password
        - key: vault_addr
          value: https://vault.{{ .Values.domains.external }}
        - key: path
          value: servc/*
        - key: capabilities
          value: create,read,update,delete,list,patch,sudo

    vault-oidc:
      enabled: true
      type: vault
      provider: oidc-config
      name: vault-oidc
      vars:
        - key: input
          value: ""
        - key: output
          value: ""
        - key: oidc_discovery_url
          value: https://auth.{{ .Values.domains.external }}
        - key: oidc_client_id
          value: vault
        - key: oidc_client_secret_path
          value: external-infra/vendor/authelia-apps
        - key: oidc_client_secret_key
          value: client-secret-vault
        - key: vault_url
          value: https://vault.{{ .Values.domains.external }}

    authelia-salihah:
      enabled: true
      type: vault
      provider: oidc
      name: authelia-salihah
      vars:
        - key: input
          value: ""
        - key: output
          value: ""
        - key: name
          value: salihah
        - key: manage_identity
          value: "false"
        - key: path
          value: external-infra/data/authelia/salihah
        - key: capabilities
          value: read,update,patch

    authelia-salihah-browse:
      enabled: true
      type: vault
      provider: oidc
      name: authelia-salihah-browse
      vars:
        - key: input
          value: ""
        - key: output
          value: ""
        - key: name
          value: salihah
        - key: path
          value: external-infra/metadata/authelia
        - key: capabilities
          value: list

    authelia-yusuf-browse:
      enabled: true
      type: vault
      provider: oidc
      name: authelia-yusuf-browse
      vars:
        - key: input
          value: ""
        - key: output
          value: ""
        - key: name
          value: yusuf
        - key: path
          value: external-infra/metadata/authelia
        - key: capabilities
          value: list

    authelia-yusuf:
      enabled: true
      type: vault
      provider: oidc
      name: authelia-yusuf
      vars:
        - key: input
          value: ""
        - key: output
          value: ""
        - key: name
          value: yusuf
        - key: manage_identity
          value: "false"
        - key: path
          value: external-infra/data/authelia/yusuf
        - key: capabilities
          value: read,update,patch

    authelia-yusuf-servc:
      enabled: true
      type: vault
      provider: oidc
      name: authelia-yusuf-servc
      vars:
        - key: input
          value: ""
        - key: output
          value: ""
        - key: name
          value: yusuf
        - key: manage_identity
          value: "false"
        - key: path
          value: servc/*
        - key: capabilities
          value: create,read,update,list,patch

    authelia-murtz-servc:
      enabled: true
      type: vault
      provider: oidc
      name: authelia-murtz-servc
      vars:
        - key: input
          value: ""
        - key: output
          value: ""
        - key: name
          value: murtz
        - key: manage_identity
          value: "false"
        - key: path
          value: servc/*
        - key: capabilities
          value: create,read,update,list,patch

    authelia-murtz:
      enabled: true
      type: vault
      provider: oidc
      name: authelia-murtz
      vars:
        - key: input
          value: ""
        - key: output
          value: ""
        - key: name
          value: murtz
        - key: manage_identity
          value: "false"
        - key: path
          value: external-infra/data/authelia/murtz
        - key: capabilities
          value: read,update,patch

    authelia-murtz-browse:
      enabled: true
      type: vault
      provider: oidc
      name: authelia-murtz-browse
      vars:
        - key: input
          value: ""
        - key: output
          value: ""
        - key: name
          value: murtz
        - key: path
          value: external-infra/metadata/authelia
        - key: capabilities
          value: list

    s3-backups-b2:
      enabled: true
      type: s3
      provider: b2
      name: thorin-backups
      vars:
        - key: input
          value: external-infra/vendor/blackblaze
        - key: output
          value: external-infra/iac/s3-backups-b2

    s3-pvcbackups-k8s:
      enabled: true
      type: s3
      provider: minio
      name: pvc-backups
      vars:
        - key: input
          value: external-infra/vendor/minio
        - key: output
          value: external-infra/iac/s3-pvcbackups-k8s

    s3-thanos:
      enabled: true
      type: s3
      provider: minio
      name: thanos
      vars:
        - key: input
          value: external-infra/vendor/minio
        - key: output
          value: external-infra/iac/s3-thanos

    s3-backups-k8s:
      enabled: true
      type: s3
      provider: minio
      name: db-backups
      vars:
        - key: input
          value: external-infra/vendor/minio
        - key: output
          value: external-infra/iac/s3-db-backups

    postgres-gitea:
      enabled: true
      type: postgres
      provider: db
      name: gitea
      vars:
        - key: input
          value: external-infra/iac/postgres
        - key: credentialpath
          value: external-infra/vendor/postgres
        - key: passwordkey
          value: gitea
        - key: output
          value: external-infra/iac/postgres-gitea

    postgres-coder:
      enabled: true
      type: postgres
      provider: db
      name: coder
      vars:
        - key: input
          value: external-infra/iac/postgres
        - key: credentialpath
          value: external-infra/vendor/postgres
        - key: passwordkey
          value: coder
        - key: output
          value: external-infra/iac/postgres-coder

    postgres-authelia:
      enabled: true
      type: postgres
      provider: db
      name: authelia
      vars:
        - key: input
          value: external-infra/iac/postgres
        - key: credentialpath
          value: external-infra/vendor/postgres
        - key: passwordkey
          value: authelia
        - key: output
          value: external-infra/iac/postgres-authelia

    gitea-argocd:
      enabled: true
      type: gitea
      provider: user
      name: argocd
      vars:
        - key: gitea_url
          value: https://git.{{ .Values.domains.external }}
        - key: credentialpath
          value: external-infra/vendor/gitea
        - key: provider_usernamekey
          value: root-username
        - key: provider_passwordkey
          value: root-password
        - key: usernamekey
          value: argo-username
        - key: passwordkey
          value: argo-password

    gitea-rennovate:
      enabled: true
      type: gitea
      provider: user
      name: rennovate
      vars:
        - key: gitea_url
          value: https://git.{{ .Values.domains.external }}
        - key: credentialpath
          value: external-infra/vendor/gitea
        - key: provider_usernamekey
          value: root-username
        - key: provider_passwordkey
          value: root-password
        - key: usernamekey
          value: rennovate-username
        - key: passwordkey
          value: rennovate-password

    gitea-rennovate-token:
      enabled: true
      type: gitea
      provider: token
      name: rennovate
      vars:
        - key: gitea_url
          value: https://git.{{ .Values.domains.external }}
        - key: credentialpath
          value: external-infra/vendor/gitea
        - key: usernamekey
          value: rennovate-username
        - key: passwordkey
          value: rennovate-password
        - key: output
          value: external-infra/iac/gitea-rennovate

    gitea-servc-vault-addr:
      enabled: true
      type: gitea
      provider: orgsecret
      name: VAULT_ADDR
      vars:
        - key: path
          value: external-infra/iac/vault-user-servc
        - key: property
          value: vault-addr
        - key: org
          value: serv-c
        - key: gitea_url
          value: https://git.yusufali.ca
        - key: credentialpath
          value: external-infra/vendor/gitea
        - key: usernamekey
          value: root-username
        - key: passwordkey
          value: root-password

    gitea-servc-vault-username:
      enabled: true
      type: gitea
      provider: orgsecret
      name: VAULT_USERNAME
      vars:
        - key: path
          value: external-infra/iac/vault-user-servc
        - key: property
          value: username
        - key: org
          value: serv-c
        - key: gitea_url
          value: https://git.yusufali.ca
        - key: credentialpath
          value: external-infra/vendor/gitea
        - key: usernamekey
          value: root-username
        - key: passwordkey
          value: root-password

    gitea-servc-vault-password:
      enabled: true
      type: gitea
      provider: orgsecret
      name: VAULT_PASSWORD
      vars:
        - key: path
          value: external-infra/iac/vault-user-servc
        - key: property
          value: password
        - key: org
          value: serv-c
        - key: gitea_url
          value: https://git.yusufali.ca
        - key: credentialpath
          value: external-infra/vendor/gitea
        - key: usernamekey
          value: root-username
        - key: passwordkey
          value: root-password

    gitea-chintan:
      enabled: true
      type: gitea
      provider: user
      name: chintan
      vars:
        - key: gitea_url
          value: https://git.{{ .Values.domains.external }}
        - key: credentialpath
          value: external-infra/vendor/gitea
        - key: provider_usernamekey
          value: root-username
        - key: provider_passwordkey
          value: root-password
        - key: usernamekey
          value: chintan-username
        - key: passwordkey
          value: chintan-password

    gitea-chintan-token:
      enabled: true
      type: gitea
      provider: token
      name: chintan
      vars:
        - key: gitea_url
          value: https://git.{{ .Values.domains.external }}
        - key: credentialpath
          value: external-infra/vendor/gitea
        - key: usernamekey
          value: chintan-username
        - key: passwordkey
          value: chintan-password
        - key: output
          value: external-infra/iac/gitea

domains:
  internal: asd
  external: asd

authelia:
  enabled: true
  database:
    remoteKey: iac/postgres-authelia

  secrets:
    remoteKey: vendor/selfhosted-app-tokens

  users:
    - name: yusuf
      remoteKey: authelia/yusuf
    - name: salihah
      remoteKey: authelia/salihah
    - name: murtz
      remoteKey: authelia/murtz

  clients:
    client_remote_key: vendor/authelia-apps
    claims_policies:
      vault:
        id_token:
          - preferred_username
      servc-mcp:
        access_token:
          - email
          - email_verified
    hmac:
      remoteKey: vendor/authelia-apps
      property: hmac-secret
    jwks-private:
      remoteKey: vendor/authelia-apps
      property: jwks-private
    jwks-public:
      remoteKey: vendor/authelia-apps
      property: jwks-public

    list:
      sure:
        client_id: sure
        client_name: Sure
        client_secret_property: client-secret-sure
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://sure.yusufali.ca/auth/openid_connect/callback
          scopes:
            - openid
            - profile
            - email
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic

      postiz:
        client_id: postiz
        client_name: Postiz
        client_secret_property: client-secret-postiz
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: false
          redirect_uris:
            - https://postiz.yusufali.ca/settings
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post

      affine:
        client_id: affine
        client_name: AFFiNE
        client_secret_property: client-secret-affine
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://miro.yusufali.ca/oauth/callback
          scopes:
            - openid
            - profile
            - email
            - groups
            - offline_access
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post

      affine-mcp:
        client_id: affine-mcp
        client_name: AFFiNE MCP
        client_secret_property: client-secret-affine
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://chatgpt.com/connector_platform_oauth_redirect
            - https://claude.ai/api/mcp/auth_callback
          audience:
            - https://miro-mcp.yusufali.ca/mcp
          requested_audience_mode: implicit
          scopes:
            - openid
            - profile
            - email
            - offline_access
          response_types:
            - code
          grant_types:
            - authorization_code
            - refresh_token
          access_token_signed_response_alg: RS256
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post

      servc-nonprod:
        client_id: servc-nonprod
        client_name: Servc Nonprod MCP
        client_secret_property: client-secret-servc
        oidc:
          claims_policy: servc-mcp
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://chatgpt.com/connector_platform_oauth_redirect
          audience:
            - https://nonprod-api.servc.io/mcp/onprem
            - https://nonprod-mcp.modlin.ai/mcp/onprem
            - https://mcp.modlin.ai/mcp/gptplugin
          requested_audience_mode: implicit
          scopes:
            - openid
            - profile
            - email
            - offline_access
          response_types:
            - code
          grant_types:
            - authorization_code
            - refresh_token
          access_token_signed_response_alg: RS256
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post

      grafana:
        client_id: grafana
        client_name: Grafana
        client_secret_property: client-secret-grafana
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://grafana.yusufali.ca/login/generic_oauth
            - https://grafana-us.servc.io/login/generic_oauth
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic

      argocd:
        client_id: argocd
        client_name: Argo CD
        client_secret_property: client-secret-argocd
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: false
          redirect_uris:
            - https://argocd.yusufali.ca/auth/callback
            - https://argocd-us.servc.io/auth/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic

      gitea:
        client_id: gitea
        client_name: Gitea
        client_secret_property: client-secret-gitea
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: false
          redirect_uris:
            - https://git.yusufali.ca/user/oauth2/gitea/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post

      immich:
        client_id: immich
        client_name: immich
        client_secret_property: client-secret-immich
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://photos.yusufali.ca/auth/login
            - https://photos.yusufali.ca/user-settings
            - app.immich:///oauth-callback
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic

      filebrowse:
        client_id: filebrowse
        client_name: FileBrowser
        client_secret_property: client-secret-filebrowse
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: false
          redirect_uris:
            - https://drive.yusufali.ca/api/auth/oidc/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post

      bitwarden:
        client_id: bitwarden
        client_name: Vaultwarden
        client_secret_property: client-secret-bitwarden
        oidc:
          public: false
          authorization_policy: one_factor
          consent_mode: implicit
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://bitwarden.yusufali.ca/identity/connect/oidc-signin
          scopes:
            - openid
            - offline_access
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
            - refresh_token
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic

      vault:
        client_id: vault
        client_name: Vault
        client_secret_property: client-secret-vault
        oidc:
          claims_policy: vault
          public: false
          authorization_policy: two_factor
          consent_mode: implicit
          require_pkce: false
          redirect_uris:
            - https://vault.yusufali.ca/ui/vault/auth/oidc/oidc/callback
            - http://localhost:8250/oidc/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic

