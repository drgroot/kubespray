apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: {{ .Values.storage.default }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.project }}-frigate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  destination:
    namespace: {{ .Release.Namespace }}
    server: "https://kubernetes.default.svc"
  project: {{ .Values.project }}
  sources:
    - path: charts/template-single
      repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      helm:
        values: |
          fullnameOverride: frigate

          {{- with .Values.storage }}
          storageclasses:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.domains }}
          domains:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        valueFiles:
          - $values/charts/mordor/frigate.values.yaml
    - repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      ref: values
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: frigate-rtsp
spec:
  parentRefs:
    - name: gateway
      namespace: system-envoy
      sectionName: frigate-rtsp
  rules:
    - backendRefs:
        - name: frigate
          port: 8554
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: frigate-webrtc-tcp
spec:
  parentRefs:
    - name: gateway
      namespace: system-envoy
      sectionName: frigate-webrtc-tcp
  rules:
    - backendRefs:
        - name: frigate
          port: 8555
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: frigate-webrtc-udp
spec:
  parentRefs:
    - name: gateway
      namespace: system-envoy
      sectionName: frigate-webrtc-udp
  rules:
    - backendRefs:
        - name: frigate
          port: 8555
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate-internal
spec:
  ingressClassName: nginx
  rules:
    - host: nvr.{{ .Values.domains.internal }}
      http:
        paths:
          - backend:
              service:
                name: frigate
                port:
                  number: 5000
            path: /
            pathType: Prefix
