name: Helm Lint

on:
  pull_request:

jobs:
  get_scope:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Jq
        uses: dcarbone/install-jq-action@v4.0.1
        with:
          version: 1.6

      - id: get_scope
        run: |
          charts="$(find charts -type f -name Chart.yaml -exec dirname {} \; | sort | sed 's#^charts/##' | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "charts=${charts}" >> "$GITHUB_OUTPUT"

    outputs:
      charts: ${{ steps.get_scope.outputs.charts }}

  lint:
    runs-on: ubuntu-latest

    needs: get_scope

    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.get_scope.outputs.charts) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.18.4

      - name: Lint Chart
        run: helm lint charts/${{ matrix.chart }}

      - name: Template Chart
        run: helm template charts/${{ matrix.chart }}
