project: boasdasdotstrap

storage:
  default: asdasd
  nobackup: asdasd
  fast: asdasd

versions:
  authelia: 0.11.20
  gitea: 12.5.0

crossplane:
  enabled: true
  iac:
    s3-backups-b2:
      enabled: true
      type: s3
      provider: b2
      name: thorin-backups
      vars:
        - key: input
          value: external-infra/vendor/blackblaze
        - key: output
          value: external-infra/iac/s3-backups-b2

    s3-pvcbackups-k8s:
      enabled: true
      type: s3
      provider: minio
      name: pvc-backups
      vars:
        - key: input
          value: external-infra/vendor/minio
        - key: output
          value: external-infra/iac/s3-pvcbackups-k8s

    s3-backups-k8s:
      enabled: true
      type: s3
      provider: minio
      name: db-backups
      vars:
        - key: input
          value: external-infra/vendor/minio
        - key: output
          value: external-infra/iac/s3-db-backups

    s3-models:
      enabled: true
      type: s3
      provider: ovh
      name: thorin-ai-models
      vars:
        - key: input
          value: external-infra/vendor/ovh
        - key: output
          value: external-infra/iac/s3-models-ovh

    postgres-gitea:
      enabled: true
      type: postgres
      provider: db
      name: gitea
      vars:
        - key: input
          value: external-infra/iac/postgres
        - key: credentialpath
          value: external-infra/vendor/postgres
        - key: passwordkey
          value: gitea
        - key: output
          value: external-infra/iac/postgres-gitea

    postgres-coder:
      enabled: true
      type: postgres
      provider: db
      name: coder
      vars:
        - key: input
          value: external-infra/iac/postgres
        - key: credentialpath
          value: external-infra/vendor/postgres
        - key: passwordkey
          value: coder
        - key: output
          value: external-infra/iac/postgres-coder

    postgres-authelia:
      enabled: true
      type: postgres
      provider: db
      name: authelia
      vars:
        - key: input
          value: external-infra/iac/postgres
        - key: credentialpath
          value: external-infra/vendor/postgres
        - key: passwordkey
          value: authelia
        - key: output
          value: external-infra/iac/postgres-authelia

    gitea-rennovate:
      enabled: true
      type: gitea
      provider: user
      name: rennovate
      vars:
        - key: gitea_url
          value: https://git.{{ .Values.domains.external }}
        - key: credentialpath
          value: external-infra/vendor/gitea
        - key: provider_usernamekey
          value: argo-username
        - key: provider_passwordkey
          value: argo-password
        - key: usernamekey
          value: rennovate-username
        - key: passwordkey
          value: rennovate-password
        - key: output
          value: external-infra/iac/gitea-rennovate

domains:
  internal: asd
  external: asd

authelia:
  enabled: true
  database:
    remoteKey: iac/postgres-authelia

  users:
    remoteKey: vendor/authelia
    list:
      - yusuf
      - salihah

  clients:
    client_remote_key: vendor/authelia-apps
    hmac:
      remoteKey: vendor/authelia-apps
      property: hmac-secret
    jwks-private:
      remoteKey: vendor/authelia-apps
      property: jwks-private
    jwks-public:
      remoteKey: vendor/authelia-apps
      property: jwks-public

    list:
      gitea:
        client_id: gitea
        client_name: Gitea
        client_secret_property: client-secret-gitea
        oidc:
          public: false
          authorization_policy: two_factor
          require_pkce: false
          redirect_uris:
            - https://git.yusufali.ca/user/oauth2/gitea/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post

      immich:
        client_id: immich
        client_name: immich
        client_secret_property: client-secret-immich
        oidc:
          public: false
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://photos.yusufali.ca/auth/login
            - https://photos.yusufali.ca/user-settings
            - app.immich:///oauth-callback
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic

      memos:
        client_id: memos
        client_name: Memos
        client_secret_property: client-secret-memos
        oidc:
          public: false
          authorization_policy: one_factor
          require_pkce: false
          redirect_uris:
            - https://notes.yusufali.ca/auth/callback
          scopes:
            - openid
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_post

      bitwarden:
        client_id: bitwarden
        client_name: Vaultwarden
        client_secret_property: client-secret-bitwarden
        oidc:
          public: false
          authorization_policy: one_factor
          require_pkce: true
          pkce_challenge_method: S256
          redirect_uris:
            - https://bitwarden.yusufali.ca/identity/connect/oidc-signin
          scopes:
            - openid
            - offline_access
            - profile
            - email
            - groups
          response_types:
            - code
          grant_types:
            - authorization_code
            - refresh_token
          access_token_signed_response_alg: none
          userinfo_signed_response_alg: none
          token_endpoint_auth_method: client_secret_basic

