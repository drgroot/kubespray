---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: npm-credentials
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: npm-credentials
    template:
      engineVersion: v2
      mergePolicy: Merge
      type: Opaque
      data:
        host: {{ printf "npm.%s" .Values.domains.external | quote }}
  dataFrom:
    - extract:
        key: dynamic/npm-user-creds
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: npm-credentials
spec:
  updatePolicy: Replace
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: npm-credentials
  data:
    {{- range $property := list "username" "password" "read-username" "read-password" "host" }}
    - match:
        secretKey: {{ $property }}
        remoteRef:
          remoteKey: dynamic/npm
          property: {{ $property }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: npm-htpasswd
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: npm-htpasswd
    template:
      engineVersion: v2
      type: Opaque
      data:
        htpasswd: |
          {{ `{{ htpasswd .PRIVATE_USERNAME .PRIVATE_PASSWORD "bcrypt" }}` }}
          {{ `{{ htpasswd .npm_read_user .npm_read_password "bcrypt" }}` }}
        config.yaml: |
          listen: 0.0.0.0:4873
          storage: /verdaccio/storage
          web:
            showDownloadTarball: false
            showRaw: false
          auth:
            htpasswd:
              file: /htpasswd/htpasswd
              max_users: -1
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
              cache: true
          packages:
            '@servc/*':
              access: $authenticated
              publish: {{ `{{ .PRIVATE_USERNAME | quote }}` }}

            '@*/*':
              access: $all
              proxy: npmjs

            '**':
              access: $all
              proxy: npmjs
  data:
    - remoteRef:
        key: dynamic/npm
        property: username
      secretKey: PRIVATE_USERNAME
    - remoteRef:
        key: dynamic/npm
        property: password
      secretKey: PRIVATE_PASSWORD
    - remoteRef:
        key: dynamic/npm
        property: read-username
      secretKey: npm_read_user
    - remoteRef:
        key: dynamic/npm
        property: read-password
      secretKey: npm_read_password

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: npm
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: {{ .Values.storage.nobackup }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm
  labels:
    app: npm
spec:
  selector:
    matchLabels:
      app: npm
  template:
    metadata:
      labels:
        app: npm
    spec:
      imagePullSecrets:
        - name: cluster-docker-secrets
      volumes:
        - name: npmdata
          persistentVolumeClaim:
            claimName: npm
        - name: config
          secret:
            secretName: npm-htpasswd
            items:
              - key: config.yaml
                path: config.yaml
        - name: htppasswd
          secret:
            secretName: npm-htpasswd
      containers:
        - name: app
          image: {{ tpl .Values.npm.image.registry . }}{{ .Values.npm.image.repository }}:{{ .Values.npm.image.tag }}
          ports:
            - containerPort: 4873
              name: http
          resources:
            {{- with.Values.npm.resources }}
            requests:
              {{- toYaml . | nindent 14 }}
            limits:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /-/ping
              port: 4873
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 5
          volumeMounts:
            - name: htppasswd
              mountPath: /htpasswd
            - name: npmdata
              mountPath: /verdaccio/storage
            - name: config
              mountPath: /verdaccio/conf
---
apiVersion: v1
kind: Service
metadata:
  name: npm
  labels:
    app: npm
spec:
  selector:
    app: npm
  ports:
    - protocol: TCP
      port: 4873
      targetPort: 4873
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: npm
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: gateway
    namespace: system-envoy
    sectionName: https
  hostnames:
  - npm.{{ .Values.domains.external }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: Upgrade
        value: websocket
    backendRefs:
    - name: npm
      port: 4873
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Original-URI
          value: '%REQ(:PATH)%'
    name: websocket-0
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: npm
      port: 4873
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Original-URI
          value: '%REQ(:PATH)%'
    name: http-0
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: npm
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: npm
    sectionName: http-0
  requestBuffer:
    limit: 512Mi
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 60s
    tcp:
      connectTimeout: 5s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: npm-web-rps
spec:
  scaleTargetRef:
    name: npm
    kind: Deployment
  pollingInterval: 10
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.system-monitoring.svc:9090
        metricName: npm_web_rps_per_pod
        threshold: "3"
        query: |
          sum(rate(envoy_cluster_upstream_rq_total{envoy_cluster_name=~"httproute/{{ .Release.Namespace }}/npm/.*"}[1m]))
          /
          count(kube_pod_info{namespace="{{ .Release.Namespace }}",pod=~"npm-.*"})
