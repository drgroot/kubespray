{{- if .Values.authelia.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-database
spec:
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: authelia-database
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.authelia.database.remoteKey }}
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
spec:
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: authelia-secrets
  data:
    - secretKey: db-secret
      remoteRef:
        key: {{ .Values.authelia.users.remoteKey }}
        property: db-secret
    - secretKey: jwt-key
      remoteRef:
        key: {{ .Values.authelia.users.remoteKey }}
        property: jwt-key
    - secretKey: secrets-key
      remoteRef:
        key: {{ .Values.authelia.users.remoteKey }}
        property: secrets-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users-raw
spec:
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: authelia-users-raw
  data:
    {{- range $user := .Values.authelia.users.list }}
    {{- if not (regexMatch "^[a-z0-9][a-z0-9_-]*$" $user) }}
    {{- fail (printf "Authelia username %q must contain only lowercase letters, numbers, hyphens, or underscores" $user) }}
    {{- end }}
    - secretKey: {{ $user }}_displayname
      remoteRef:
        key: {{ $.Values.authelia.users.remoteKey }}
        property: {{ $user }}_displayname
    - secretKey: {{ $user }}_email
      remoteRef:
        key: {{ $.Values.authelia.users.remoteKey }}
        property: {{ $user }}_email
    - secretKey: {{ $user }}_groups
      remoteRef:
        key: {{ $.Values.authelia.users.remoteKey }}
        property: {{ $user }}_groups
    - secretKey: {{ $user }}_password
      remoteRef:
        key: {{ $.Values.authelia.users.remoteKey }}
        property: {{ $user }}_password
    {{- end }}
{{- if .Values.authelia.clients.list }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc
spec:
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: authelia-oidc
  data:
    - secretKey: hmac-secret
      remoteRef:
        key: {{ .Values.authelia.clients.hmac.remoteKey }}
        property: {{ .Values.authelia.clients.hmac.property }}
    - secretKey: jwks-private
      remoteRef:
        key: {{ (index .Values.authelia.clients "jwks-private").remoteKey }}
        property: {{ (index .Values.authelia.clients "jwks-private").property }}
    {{- range $name, $client := .Values.authelia.clients.list }}
    {{- if not (regexMatch "^[a-z0-9][a-z0-9_-]*$" $name) }}
    {{- fail (printf "Authelia OIDC client name %q must contain only lowercase letters, numbers, hyphens, or underscores" $name) }}
    {{- end }}
    - secretKey: {{ $name }}-client-secret
      remoteRef:
        key: {{ $.Values.authelia.clients.client_remote_key }}
        property: {{ $client.client_secret_property }}
    {{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-external-authelia
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  destination:
    namespace: {{ .Release.Namespace }}
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: authelia
    repoURL: https://charts.authelia.com
    targetRevision: {{ .Values.versions.authelia }}
    helm:
      releaseName: authelia
      values: |-
        image:
          pullSecrets:
            - cluster-docker-secrets

        ingress:
          enabled: true
          className: nginx
          certManager: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            external-dns.alpha.kubernetes.io/target: mordorhome.{{ .Values.domains.external }}
          tls:
            enabled: true
            secret: authelia-tls

        configMap:
          authentication_backend:
            file:
              enabled: true
              path: /config/users_database.yml

          access_control:
            default_policy: deny
            rules:
              - domain: radarr.{{ .Values.domains.external }}
                policy: one_factor
                subject:
                  - group:media-admin
                  - group:media-dev
              - domain: sonarr.{{ .Values.domains.external }}
                policy: one_factor
                subject:
                  - group:media-admin
                  - group:media-dev
              - domain: prowlarr.{{ .Values.domains.external }}
                policy: one_factor
                subject:
                  - group:media-admin
              - domain: sabnzbd.{{ .Values.domains.external }}
                policy: one_factor
                subject:
                  - group:media-admin
              - domain: nvr.{{ .Values.domains.external }}
                policy: one_factor
                subject:
                  - group:media-dev
              - domain: syncthing.{{ .Values.domains.external }}
                policy: one_factor
                subject:
                  - group:media-admin

          identity_validation:
            reset_password:
              secret:
                secret_name: authelia-secrets
                path: jwt-key

          session:
            encryption_key:
              secret_name: authelia-secrets
              path: secrets-key
            cookies:
              - domain: {{ .Values.domains.external }}
                subdomain: auth

          storage:
            encryption_key:
              secret_name: authelia-secrets
              path: db-secret
            postgres:
              enabled: true
              address: tcp://db.{{ .Release.Namespace }}.svc.cluster.local:5432
              database: db_authelia
              username: authelia
              password:
                secret_name: authelia-database
                path: password

          notifier:
            smtp:
              enabled: true
              password:
                secret_name: cluster-smtp-secrets
                path: SMTP_PASSWORD

          {{- if .Values.authelia.clients.list }}
          identity_providers:
            oidc:
              enabled: true
              hmac_secret:
                secret_name: authelia-oidc
                path: hmac-secret
              jwks:
                - algorithm: RS256
                  use: sig
                  key:
                    path: /secrets/authelia-oidc/jwks-private
              clients:
                {{- range $name, $client := .Values.authelia.clients.list }}
                - client_id: {{ $client.client_id | quote }}
                  client_name: {{ $client.client_name | quote }}
                  # Generated by the init container from the raw secret; never put it in Git.
                  client_secret:
                    path: /config/oidc/{{ $name }}-client-secret-hash
                  {{- toYaml $client.oidc | nindent 18 }}
                {{- end }}
          {{- end }}

        persistence:
          enabled: true
          storageClass: {{ .Values.storage.default }}

        pod:
          kind: Deployment
          replicas: 2
          annotations:
            secret.reloader.stakater.com/reload: authelia-users-raw,authelia-oidc
          env:
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: cluster-smtp-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: cluster-smtp-secrets
                  key: SMTP_PORT
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cluster-smtp-secrets
                  key: SMTP_USERNAME
            - name: SMTP_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: cluster-smtp-secrets
                  key: SMTP_FROM_EMAIL
            - name: AUTHELIA_NOTIFIER_SMTP_ADDRESS
              value: submission://$(SMTP_HOST):$(SMTP_PORT)
            - name: AUTHELIA_NOTIFIER_SMTP_SENDER
              value: Authelia <$(SMTP_FROM_EMAIL)>
            - name: AUTHELIA_NOTIFIER_SMTP_USERNAME
              value: $(SMTP_USERNAME)
          extraVolumes:
            - name: authelia-users-raw
              secret:
                secretName: authelia-users-raw
            {{- if .Values.authelia.clients.list }}
            - name: authelia-oidc
              secret:
                secretName: authelia-oidc
            {{- end }}
          initContainers:
            - name: generate-users-database
              image: ghcr.io/authelia/authelia:4.39.20
              command:
                - /bin/sh
                - -ec
                - |
                  yaml_quote() {
                    printf "%s" "$1" | sed "s/'/''/g; s/^/'/; s/$/'/"
                  }

                  {
                    echo "users:"
                    {{- range $user := .Values.authelia.users.list }}
                    password_hash="$(authelia crypto hash generate argon2 --password "$(cat /users/{{ $user }}_password)" | sed -n 's/^Digest: //p')"
                    test -n "$password_hash"
                    echo "  {{ $user }}:"
                    printf "    displayname: %s\\n" "$(yaml_quote "$(cat /users/{{ $user }}_displayname)")"
                    printf "    email: %s\\n" "$(yaml_quote "$(cat /users/{{ $user }}_email)")"
                    echo "    groups:"
                    tr ',' '\n' < /users/{{ $user }}_groups | while IFS= read -r group || [ -n "$group" ]; do
                      test -n "$group" && printf "      - %s\\n" "$(yaml_quote "$group")"
                    done
                    printf "    password: %s\\n" "$password_hash"
                    {{- end }}
                  } > /config/users_database.yml

                  {{- if .Values.authelia.clients.list }}
                  mkdir -p /config/oidc
                  {{- range $name, $client := .Values.authelia.clients.list }}
                  client_secret_hash="$(authelia crypto hash generate pbkdf2 --variant sha512 --password "$(cat /oidc/{{ $name }}-client-secret)" | sed -n 's/^Digest: //p')"
                  test -n "$client_secret_hash"
                  printf '%s\\n' "$client_secret_hash" > /config/oidc/{{ $name }}-client-secret-hash
                  {{- end }}
                  {{- end }}
              volumeMounts:
                - name: authelia
                  mountPath: /config
                - name: authelia-users-raw
                  mountPath: /users
                  readOnly: true
                {{- if .Values.authelia.clients.list }}
                - name: authelia-oidc
                  mountPath: /oidc
                  readOnly: true
                {{- end }}

        secret:
          additionalSecrets:
            authelia-database:
              items:
                - key: password
                  path: password
            authelia-secrets:
              items:
                - key: db-secret
                  path: db-secret
                - key: jwt-key
                  path: jwt-key
                - key: secrets-key
                  path: secrets-key
            cluster-smtp-secrets:
              items:
                - key: SMTP_PASSWORD
                  path: SMTP_PASSWORD
            {{- if .Values.authelia.clients.list }}
            authelia-oidc:
              items:
                - key: hmac-secret
                  path: hmac-secret
                - key: jwks-private
                  path: jwks-private
                {{- range $name, $client := .Values.authelia.clients.list }}
                - key: {{ $name }}-client-secret
                  path: {{ $name }}-client-secret
                {{- end }}
            {{- end }}
{{- end }}
