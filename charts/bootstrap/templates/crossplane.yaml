{{- if .Values.crossplane.enabled -}}
# provider-ansible v0.8.0 requires this namespace for its coordination lease.
apiVersion: v1
kind: Namespace
metadata:
  name: upbound-system
  labels:
    tenant: approved
---
apiVersion: v1
kind: Namespace
metadata:
  name: system-crossplane
  labels:
    tenant: approved
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-crossplane
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  destination:
    namespace: system-crossplane
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: crossplane
    repoURL: https://charts.crossplane.io/stable
    targetRevision: {{ .Values.versions.crossplane }}
    helm:
      releaseName: system-crossplane
      values: |-
        resourcesCrossplane:
          limits:
            cpu: ~ # 500m
            memory: ~ # 1024Mi
          requests:
            cpu: ~
            memory: ~
        
        resourcesRBACManager:
          limits:
            cpu: ~ #100m
            memory: ~ #512Mi
          requests:
            cpu: ~ #100m
            memory: ~ #256Mi
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: opentofu-oci-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              args:
                - --max-reconcile-rate={{ .Values.crossplane.opentofuMaxReconcileRate }}
              env:
                - name: XDG_CONFIG_HOME
                  value: /etc/opentofu
                - name: HELM_CACHE_HOME
                  value: /tmp/helm
                - name: HELM_CONFIG_HOME
                  value: /tmp/helm
              volumeMounts:
                - name: oci-auth
                  mountPath: /etc/opentofu/containers/auth.json
                  subPath: .dockerconfigjson
                  readOnly: true
          volumes:
            - name: oci-auth
              secret:
                secretName: {{ .Values.crossplane.opentofuOciAuthSecretName | quote }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  package: xpkg.upbound.io/upbound/provider-opentofu:{{ .Values.versions.crossplaneOpenTofu }}
  runtimeConfigRef:
    name: opentofu-oci-runtime
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-ansible
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-ansible:{{ .Values.versions.crossplaneAnsible }}
{{- end }}
