apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport-proxy
  namespace: system-envoy
spec:
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyService:
        type: NodePort
      envoyDaemonSet:
        container:
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_BIND_SERVICE
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
        strategy:
          rollingUpdate:
            maxUnavailable: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-nodeport
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nodeport-proxy
    namespace: system-envoy
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: system-envoy
spec:
  gatewayClassName: envoy-nodeport

  listeners:
    - name: postgres
      protocol: TCP
      port: 5432
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: All

    - name: ingress-https
      protocol: TCP
      port: 443
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Same

    - name: ingress-http
      protocol: TCP
      port: 80
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ingress-https
  namespace: system-envoy
spec:
  parentRefs:
    - name: gateway
      sectionName: ingress-https
  rules:
    - backendRefs:
        - name: ingress-nginx-controller
          namespace: kube-networking
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: ingress-http
  namespace: system-envoy
spec:
  parentRefs:
    - name: gateway
      sectionName: ingress-http
  rules:
    - backendRefs:
        - name: ingress-nginx-controller
          namespace: kube-networking
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: ingress
  namespace: kube-networking
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: system-envoy
  to:
    - group: ""
      kind: Service
