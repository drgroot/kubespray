{{- if .Values.crossplane.enabled -}}
# provider-ansible v0.8.0 requires this namespace for its coordination lease.
apiVersion: v1
kind: Namespace
metadata:
  name: upbound-system
  labels:
    tenant: approved
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: system-crossplane
  labels:
    tenant: approved
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-crossplane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
  destination:
    namespace: system-crossplane
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: crossplane
    repoURL: https://charts.crossplane.io/stable
    targetRevision: {{ .Values.versions.crossplane }}
    helm:
      releaseName: system-crossplane
      values: |-
        resourcesCrossplane:
          limits:
            cpu: ~ # 500m
            memory: ~ # 1024Mi
          requests:
            cpu: ~
            memory: ~
        
        resourcesRBACManager:
          limits:
            cpu: ~ #100m
            memory: ~ #512Mi
          requests:
            cpu: ~ #100m
            memory: ~ #256Mi
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: opentofu-oci-runtime
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          {{- if .Values.versions.crossplaneOpenTofuBinary }}
          securityContext:
            fsGroup: 2000
          initContainers:
            - name: install-opentofu
              image: alpine:3.22.2
              securityContext:
                runAsNonRoot: true
                runAsUser: 2000
                runAsGroup: 2000
              env:
                - name: OPENTOFU_VERSION
                  value: {{ .Values.versions.crossplaneOpenTofuBinary | trimPrefix "v" | quote }}
              command:
                - /bin/sh
                - -ec
                - |
                  case "$(uname -m)" in
                    x86_64) arch=amd64 ;;
                    aarch64) arch=arm64 ;;
                    *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                  esac
                  wget -O /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/v${OPENTOFU_VERSION}/tofu_${OPENTOFU_VERSION}_linux_${arch}.zip"
                  unzip -p /tmp/tofu.zip tofu > /opentofu-bin/tofu
                  chmod 0755 /opentofu-bin/tofu
                  /opentofu-bin/tofu version
              volumeMounts:
                - name: opentofu-bin
                  mountPath: /opentofu-bin
          {{- end }}
          containers:
            - name: package-runtime
              args:
                - --max-reconcile-rate={{ .Values.crossplane.opentofuMaxReconcileRate }}
              env:
                - name: XDG_CONFIG_HOME
                  value: /etc/opentofu
                - name: HELM_CACHE_HOME
                  value: /tmp/helm
                - name: HELM_CONFIG_HOME
                  value: /tmp/helm
              volumeMounts:
                {{- if .Values.versions.crossplaneOpenTofuBinary }}
                - name: opentofu-bin
                  mountPath: /usr/local/bin/tofu
                  subPath: tofu
                  readOnly: true
                {{- end }}
                - name: oci-auth
                  mountPath: /etc/opentofu/containers/auth.json
                  subPath: .dockerconfigjson
                  readOnly: true
          volumes:
            {{- if .Values.versions.crossplaneOpenTofuBinary }}
            - name: opentofu-bin
              emptyDir: {}
            {{- end }}
            - name: oci-auth
              secret:
                secretName: {{ .Values.crossplane.opentofuOciAuthSecretName | quote }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
spec:
  package: xpkg.upbound.io/upbound/provider-opentofu:{{ .Values.versions.crossplaneOpenTofu }}
  runtimeConfigRef:
    name: opentofu-oci-runtime
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-ansible
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-ansible:{{ .Values.versions.crossplaneAnsible }}
  runtimeConfigRef:
    name: provider-ansible-runtime
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: provider-ansible-callbacks
  namespace: system-crossplane
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
data:
  crossplane_json.py: |
    {{- .Files.Get "files/callback_plugins/crossplane_json.py" | nindent 4 }}
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-ansible-runtime
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-ansible
  deploymentTemplate:
    spec:
      selector: {}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: provider-ansible
        spec:
          automountServiceAccountToken: true
          containers:
            - name: package-runtime
              volumeMounts:
                - name: callbacks
                  mountPath: /opt/ansible/callback_plugins
                  readOnly: true
          volumes:
            - name: callbacks
              configMap:
                name: provider-ansible-callbacks
{{- end }}
