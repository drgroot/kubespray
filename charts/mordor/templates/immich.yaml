apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-redis
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: external-infra
    kind: ClusterSecretStore
  target:
    name: immich-redis
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: redishostname
      remoteRef:
        key: iac/redis
        property: hostname
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.project }}-immich
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  destination:
    namespace: {{ .Release.Namespace }}
    server: "https://kubernetes.default.svc"
  project: {{ .Values.project }}
  sources:
    - path: charts/template-multi
      repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      helm:
        values: |
          fullnameOverride: immich

          {{- with .Values.storage }}
          storageclasses:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- with .Values.domains }}
          domains:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        valueFiles:
          - $values/charts/mordor/immich.values.yaml
    - repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      ref: values
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich-db
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  destination:
    namespace: {{ .Release.Namespace }}
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    path: "charts/postgres"
    repoURL: "https://github.com/drgroot/kubespray.git"
    targetRevision: main
    helm:
      releaseName: immich-db
      values: |-
        fullnameOverride: immich-db

        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        imagePullSecrets:
          - name: cluster-docker-secrets
        storageclass: {{ .Values.storage.fast }}

        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi

        backup:
          image: dockerhub.yusufali.ca/rclone/rclone:latest@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
          secretStore:
            name: vault
            type: ClusterSecretStore
          rclone:
            remoteRef:
              key: dynamic/s3-db-backups
              property: rclone

        secrets:
          secretStore:
            name: vault
            type: ClusterSecretStore
          username:
            remoteRef:
              key: vendor/postgres
              property: root-username
          password:
            remoteRef:
              key: dynamic/postgres-app-creds
              property: immich
          pushsecret:
            enabled: true
            secretStore:
              name: vault
              type: ClusterSecretStore
            remoteKey: dynamic/postgres-server-immich

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-postgres-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: immich-postgres-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: dynamic/postgres-server-immich
