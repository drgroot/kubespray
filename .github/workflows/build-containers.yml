name: Build containers

on:
  pull_request:
    paths:
      - containers/**
      - .github/workflows/build-containers.yml
  push:
    branches: [main]
    paths:
      - containers/**
      - .github/workflows/build-containers.yml
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover containers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.containers.outputs.matrix }}
      has-containers: ${{ steps.containers.outputs.has-containers }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate build matrix
        id: containers
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          containers = []
          for dockerfile in sorted(Path("containers").glob("*/Dockerfile")):
              package = dockerfile.parent.name
              options = {"image": package, "tag": "latest", "check-target": ""}
              config = dockerfile.parent / "build.json"
              if config.is_file():
                  overrides = json.loads(config.read_text())
                  if not isinstance(overrides, dict) or any(
                      key not in options or not isinstance(value, str)
                      for key, value in overrides.items()
                  ):
                      raise ValueError(f"Invalid build options in {config}")
                  options.update(overrides)
              containers.append({"package": package, **options})

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": containers}, separators=(",", ":")) + "\n")
              output.write("has-containers=" + str(bool(containers)).lower() + "\n")

  build:
    name: Build ${{ matrix.package }}
    needs: discover
    if: needs.discover.outputs.has-containers == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Filter changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'containers/${{ matrix.package }}/**'
              - '.github/workflows/build-containers.yml'
      - name: Set image metadata
        id: metadata
        env:
          PUBLISH_TAG: ${{ matrix.tag || 'latest' }}
          CHANGED: ${{ steps.changes.outputs.src }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          build=false
          publish=false
          version="pr-${GITHUB_RUN_NUMBER}"

          if [[ "$CHANGED" == true || "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            build=true
          fi
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            version="$PUBLISH_TAG"
            if [[ "$EVENT" != pull_request && "$build" == true ]]; then
              publish=true
            fi
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set publish destination
        id: destination
        if: steps.metadata.outputs.publish == 'true'
        env:
          REGISTRY_HOST: ${{ secrets.DOCKER_HOST }}
          REGISTRY_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_NAME: ${{ matrix.image || matrix.package }}
        run: |
          set -euo pipefail
          registry="${REGISTRY_HOST#*://}"
          registry="${registry%/}"
          test -n "$registry"
          test -n "$REGISTRY_USERNAME"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "image=$registry/$REGISTRY_USERNAME/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker registry
        if: steps.metadata.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.destination.outputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        if: steps.metadata.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Validate container build
        if: steps.metadata.outputs.build == 'true' && steps.metadata.outputs.publish != 'true'
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.package }}
          file: containers/${{ matrix.package }}/Dockerfile
          push: false
          tags: local/${{ matrix.package }}:${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
      - name: Validate kernel module compilation
        if: steps.metadata.outputs.build == 'true' && matrix.check-target != ''
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.package }}
          target: ${{ matrix.check-target }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
      - name: Build and publish container
        if: steps.metadata.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.package }}
          file: containers/${{ matrix.package }}/Dockerfile
          push: true
          tags: ${{ steps.destination.outputs.image }}:${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,mode=max,scope=${{ matrix.package }}
