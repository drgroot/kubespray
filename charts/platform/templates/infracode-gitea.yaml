---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-runner-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-runner-secrets
  data:
    - remoteRef:
        key: dynamic/npm
        property: read-username
      secretKey: npm_read_user
    - remoteRef:
        key: dynamic/npm
        property: read-password
      secretKey: npm_read_password
    - remoteRef:
        key: vendor/gitea
        property: runner-token
      secretKey: token
    - remoteRef:
        key: dynamic/gitea-rennovate
        property: token
      secretKey: renovate-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rennovate-secrets
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: rennovate-secrets
    template:
      engineVersion: v2
      data:
        renovate-host-rules: >-
          {{ `[{"hostType":"npm","matchHost":"{{ .npm_host }}","username":"{{ .npm_read_user }}","password":"{{ .npm_read_password }}"}]` }}
  data:
    - remoteRef:
        key: dynamic/npm
        property: read-username
      secretKey: npm_read_user
    - remoteRef:
        key: dynamic/npm
        property: read-password
      secretKey: npm_read_password
    - remoteRef:
        key: dynamic/npm
        property: host
      secretKey: npm_host
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-admin-credentials
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-admin-credentials
    template:
      engineVersion: v2
      data:
        username: "{{ `{{ .rootUsername }}` }}"
        password: "{{ `{{ .rootPassword }}` }}"
  data:
    - remoteRef:
        key: vendor/gitea
        property: root-username
      secretKey: rootUsername
    - remoteRef:
        key: vendor/gitea
        property: root-password
      secretKey: rootPassword
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oauth-secrets
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-oauth-secrets
    template:
      engineVersion: v2
      data:
        key: {{ .Values.authelia.clients.list.gitea.client_id | quote }}
        secret: "{{ `{{ .clientSecret }}` }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: {{ .Values.authelia.clients.client_remote_key }}
        property: {{ .Values.authelia.clients.list.gitea.client_secret_property }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-postgres-secrets
spec:
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-postgres-secrets
  data:
    - remoteRef:
        key: dynamic/postgres-app-gitea
        property: url
      secretKey: url
    - remoteRef:
        key: dynamic/postgres-app-gitea
        property: password
      secretKey: password
    - remoteRef:
        key: dynamic/postgres-app-gitea
        property: username
      secretKey: username
    - remoteRef:
        key: dynamic/postgres-app-gitea
        property: schema
      secretKey: schema
    - remoteRef:
        key: dynamic/postgres-app-gitea
        property: hostname
      secretKey: hostname
    - remoteRef:
        key: dynamic/postgres-app-gitea
        property: database
      secretKey: database
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-external-gitea
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  destination:
    namespace: {{ .Release.Namespace }}
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: gitea
    repoURL: https://dl.gitea.com/charts/
    targetRevision: {{ .Values.versions.gitea }}
    helm:
      releaseName: gitea
      values: |-
        replicaCount: 1

        strategy:
          type: Recreate

        image:
          registry: dockerhub.{{ .Values.domains.external }}/gitea
          tag: 1.27.3

        imagePullSecrets:
          - name: cluster-docker-secrets

        service:
          ssh:
            port: 2222

        ingress:
          enabled: false
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1500m
            memory: 2Gi

        deployment:
          env: []
          annotations:
            secret.reloader.stakater.com/reload: gitea-oauth-secrets

        persistence:
          enabled: true
          storageClass: {{ .Values.storage.default }}

        gitea:
          admin:
            existingSecret: gitea-admin-credentials

          # Update the existing auth source in place using Authelia's current secret.
          oauth:
            - name: gitea
              provider: openidConnect
              existingSecret: gitea-oauth-secrets
              autoDiscoverUrl: https://auth.{{ .Values.domains.external }}/.well-known/openid-configuration

          additionalConfigFromEnvs:
            - name: GITEA__QUEUE__CONN_STR
              valueFrom:
                secretKeyRef:
                  name: gitea-redis-secrets
                  key: url
            - name: GITEA__SESSION__PROVIDER_CONFIG
              valueFrom:
                secretKeyRef:
                  name: gitea-redis-secrets
                  key: url
            - name: GITEA__CACHE__HOST
              valueFrom:
                secretKeyRef:
                  name: gitea-redis-secrets
                  key: url
            - name: GITEA__DATABASE__DB_TYPE
              value: postgres
            - name: GITEA__DATABASE__HOST
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secrets
                  key: hostname
            - name: GITEA__DATABASE__NAME
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secrets
                  key: database
            - name: GITEA__DATABASE__SCHEMA
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secrets
                  key: schema
            - name: GITEA__DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secrets
                  key: username
            - name: GITEA__DATABASE__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgres-secrets
                  key: password

            - name: GITEA__MAILER__SMTP_ADDR
              valueFrom:
                secretKeyRef:
                  name: cluster-smtp-secrets
                  key: SMTP_HOST
            - name: GITEA__MAILER__SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: cluster-smtp-secrets
                  key: SMTP_PORT
            - name: GITEA__MAILER__USER
              valueFrom:
                secretKeyRef:
                  name: cluster-smtp-secrets
                  key: SMTP_USERNAME
            - name: GITEA__MAILER__PASSWD
              valueFrom:
                secretKeyRef:
                  name: cluster-smtp-secrets
                  key: SMTP_PASSWORD
            - name: GITEA__MAILER__FROM
              valueFrom:
                secretKeyRef:
                  name: cluster-smtp-secrets
                  key: SMTP_FROM_EMAIL

            - name: GITEA__OAUTH2_CLIENT__ENABLE_AUTO_REGISTRATION
              value: "true"
            - name: GITEA__OAUTH2_CLIENT__ACCOUNT_LINKING
              value: auto
            - name: GITEA__OAUTH2_CLIENT__OPENID_CONNECT_SCOPES
              value: profile email groups
            - name: GITEA__OAUTH2_CLIENT__USERNAME
              value: preferred_username

          config:
            service:
              DISABLE_REGISTRATION: true
              ENABLE_PASSWORD_SIGNIN_FORM: false
              ENABLE_PASSKEY_AUTHENTICATION: false
              DEFAULT_ORG_VISIBILITY: limited

            server:
              DOMAIN: git.{{ .Values.domains.external }}
              ROOT_URL: https://git.{{ .Values.domains.external }}
              SSH_DOMAIN: gitea-ssh.{{ .Release.Namespace }}.svc.cluster.local
              MINIMUM_KEY_SIZE_CHECK: false
              SSH_PORT: 2222
              SSH_LISTEN_PORT: 2222
            
            repository:
              DISABLED_REPO_UNITS: repo.wikirepo.packages,repo.ext_issues,repo.ext_wiki
              DEFAULT_REPO_UNITS: repo.code,repo.pulls,repo.actions,repo.issues
              DISABLE_STARS: true
            
            packages:
              enabled: false

            security:
              ALLOWED_HOST_LIST: '*'
            
            migrations:
              ALLOW_LOCALNETWORKS: true
              ALLOWED_DOMAINS: '*'

            mailer:
              enabled: true
              protocol: smtp+starttls

            queue:
              TYPE: redis

            session:
              PROVIDER: redis

            cache:
              ENABLED: true
              ADAPTER: redis

            ssh:
              minimum_key_sizes:
                RSA: 2048

        valkey-cluster:
          enabled: false

        valkey:
          enabled: false

        postgresql-ha:
          enabled: false

        postgresql:
          enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-actions-dind-daemon
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
data:
  daemon.json: |
    {
      "registry-mirrors": [
        "https://dockerhub.{{ .Values.domains.external }}"
      ],
      "mtu": 1450
    }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap-external-gitea-actions
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: gitea-actions-runner
      jsonPointers:
        - /spec/replicas
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # RespectIgnoreDifferences=true prevents Argo CD from applying the
      # Helm-rendered statefulset.replicas: 0 during sync; KEDA exclusively
      # owns the replica count for gitea-actions-act-runner.
      - RespectIgnoreDifferences=true
  destination:
    namespace: {{ .Release.Namespace }}
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: actions
    repoURL: https://dl.gitea.com/charts/
    targetRevision: {{ .Values.versions.giteaActions }}
    helm:
      releaseName: gitea-actions
      values: |-
        global:
          storageClass: {{ .Values.storage.fast }}
          imagePullSecrets:
            - cluster-docker-secrets

        enabled: true
        existingSecret: gitea-runner-secrets
        existingSecretKey: token
        giteaRootURL: https://git.{{ .Values.domains.external }}

        statefulset:
          replicas: 0
          {{- with .Values.gitea.actions.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          extraVolumes:
            - name: docker-secret
              secret:
                secretName: cluster-docker-secrets
            - name: docker-daemon-config
              configMap:
                name: gitea-actions-dind-daemon

          dind:
            registry: dockerhub.{{ .Values.domains.external }}/library
            # Docker 29's containerd snapshotter can fail while committing
            # large layers on the action runners. Keep the overlay2 backend
            # until the newer snapshotter path is proven stable here.
            tag: 28.5.1-dind
            extraVolumeMounts:
              - name: docker-secret
                mountPath: /root/.docker/config.json
                subPath: .dockerconfigjson
              - name: docker-daemon-config
                mountPath: /etc/docker/daemon.json
                subPath: daemon.json
                readOnly: true

          runner:
            extraVolumeMounts:
              - name: docker-secret
                mountPath: /root/.docker/config.json
                subPath: .dockerconfigjson

            config: |
              log:
                level: debug
              cache:
                enabled: false
              container:
                # valid_volumes:
                #   - /var/run/docker.sock
                # options: -v /var/run/docker.sock:/var/run/docker.sock
              runner:
                labels:
                  - "ubuntu-latest:docker://dockerhub.yusufali.ca/yusufali/runner"
                  - "ubuntu-spark:docker://dockerhub.yusufali.ca/yusufali/runner-spark"

        init:
          image:
            registry: dockerhub.{{ .Values.domains.external }}/library
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-keda-secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-keda-secrets
  data:
    - remoteRef:
        key: dynamic/gitea-keda
        property: token
      secretKey: token
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: gitea-api-auth
spec:
  secretTargetRef:
    - parameter: token
      name: gitea-keda-secrets
      key: token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: gitea-actions-runner
spec:
  scaleTargetRef:
    name: gitea-actions-runner
    kind: StatefulSet
  pollingInterval: 10
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.gitea.actions.maxRunners }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 10
              periodSeconds: 30

  triggers:
    - type: metrics-api
      name: jobs
      metricType: AverageValue
      metadata:
        url: "https://git.{{ .Values.domains.external }}/api/v1/admin/actions/jobs?status=queued&status=in_progress&limit=1"
        format: json
        valueLocation: total_count
        targetValue: "1"
        authMode: bearer
      authenticationRef:
        name: gitea-api-auth
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "0 * * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 0
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      name: renovate
    spec:
      parallelism: 1
      template:
        metadata:
          name: renovate
        spec:
          imagePullSecrets:
            - name: cluster-docker-secrets
          containers:
            - name: app
              image: dockerhub.{{ .Values.domains.external }}/renovate/renovate
              env:
                - name: RENOVATE_GIT_AUTHOR
                  value: "Rennovate <rennovate@yusuf.local>"
                - name: LOG_LEVEL
                  value: debug
                - name: RENOVATE_SEMANTIC_COMMITS
                  value: "enabled"
                - name: RENOVATE_SEMANTIC_COMMIT_TYPE
                  value: fix
                - name: RENOVATE_COMMIT_MESSAGE_LOWER_CASE
                  value: "auto"
                - name: RENOVATE_PACKAGE_RULES
                  value: >-
                    [{"matchDatasources":["pypi"],"registryUrls":["https://bandersnatch.yusufali.ca/simple","https://pypi.yusufali.ca/simple"]}]
                - name: RENOVATE_AUTODISCOVER
                  value: "true"
                - name: RENOVATE_PLATFORM
                  value: gitea
                - name: RENOVATE_ENDPOINT
                  value: "https://git.{{ .Values.domains.external }}/api/v1"
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitea-runner-secrets
                      key: renovate-token
                - name: RENOVATE_HOST_RULES
                  valueFrom:
                    secretKeyRef:
                      name: rennovate-secrets
                      key: renovate-host-rules
          restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: actions-templater
spec:
  schedule: "0 * * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 0
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      name: actions-templater
    spec:
      parallelism: 1
      template:
        metadata:
          name: actions-templater
        spec:
          imagePullSecrets:
            - name: cluster-docker-secrets
          containers:
            - name: app
              image: dockerhub.yusufali.ca/yusufali/actions-templater
              imagePullPolicy: Always
              env:
                - name: GITEA_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitea-runner-secrets
                      key: renovate-token
                - name: PYTHON_VERSION
                  value: {{ .Values.actionsVerions.python | quote }}
                - name: TERRAFORM_VERSION
                  value: {{ .Values.actionsVerions.terraform | quote }}
                - name: VAULT_ACTION
                  value: {{ .Values.actionsVerions.vault | quote }}
                - name: HELM_VERSION
                  value: {{ .Values.actionsVerions.helm | quote }}
                - name: KUBELOGIN_VERSION
                  value: {{ .Values.actionsVerions.kubelogin | quote }}
                - name: KUBECTL_VERSION
                  value: {{ .Values.actionsVerions.kubectl | quote }}
                - name: CHECKOUT_VERSION
                  value: {{ .Values.actionsVerions.checkout | quote }}
                - name: SETUP_NODE_VERSION
                  value: {{ .Values.actionsVerions.setupNode | quote }}
                - name: SETUP_PYTHON_VERSION
                  value: {{ .Values.actionsVerions.setupPython | quote }}
                - name: SETUP_JQ_VERSION
                  value: {{ .Values.actionsVerions.setupJq | quote }}
                - name: SETUP_YQ_VERSION
                  value: {{ .Values.actionsVerions.setupYq | quote }}
                - name: SETUP_MAVEN_VERSION
                  value: {{ .Values.actionsVerions.setupMaven | quote }}
                - name: SETUP_JFROG_VERSION
                  value: {{ .Values.actionsVerions.setupJfrog | quote }}
                - name: SETUP_KUBECTL_VERSION
                  value: {{ .Values.actionsVerions.setupKubectl | quote }}
                - name: SETUP_HELM_VERSION
                  value: {{ .Values.actionsVerions.setupHelm | quote }}
                - name: SETUP_KUBELOGIN_VERSION
                  value: {{ .Values.actionsVerions.setupKubelogin | quote }}
                - name: SETUP_TERRAFORM_VERSION
                  value: {{ .Values.actionsVerions.setupTerraform | quote }}
                - name: SETUP_BUILDX_VERSION
                  value: {{ .Values.actionsVerions.setupBuildx | quote }}
                - name: SETUP_QEMU_VERSION
                  value: {{ .Values.actionsVerions.setupQemu | quote }}
                - name: DOCKER_LOGIN_VERSION
                  value: {{ .Values.actionsVerions.dockerLogin | quote }}
                - name: DOCKER_BUILD_AND_PUSH_VERSION
                  value: {{ .Values.actionsVerions.dockerBuildAndPush | quote }}
                - name: CHANGELOG_ACTION_VERSION
                  value: {{ .Values.actionsVerions.changelog | quote }}
                - name: JQ_VERSION
                  value: {{ .Values.actionsVerions.jq | quote }}
                - name: YQ_VERSION
                  value: {{ .Values.actionsVerions.yq | quote }}
                - name: ORAS_VERSION
                  value: {{ .Values.actionsVerions.oras | quote }}

          restartPolicy: Never

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-redis-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: gitea-redis-secrets
    template:
      engineVersion: v2
      data:
        url: {{ "{{ .url }}/0" | quote }}
  data:
    - secretKey: url
      remoteRef:
        key: dynamic/redis
        property: url

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: gateway
    namespace: system-envoy
    sectionName: https
  hostnames:
  - git.{{ .Values.domains.external }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: Upgrade
        value: websocket
    backendRefs:
    - name: gitea-http
      port: 3000
    name: websocket-0
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gitea-http
      port: 3000
    name: http-0
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: gitea
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: gitea
    sectionName: http-0
  requestBuffer:
    limit: 20Mi

  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 60s
    tcp:
      connectTimeout: 5s