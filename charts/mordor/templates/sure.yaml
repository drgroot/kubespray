# Required OpenBao properties before sync:
# - vendor/selfhosted-app-tokens: sure-SECRET_KEY_BASE,
#   sure-ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY,
#   sure-ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY,
#   sure-ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
#   (keep these encryption keys stable across deployments)
# - onprem/dynamic/authelia-client-creds: client-secret-sure (shared with Authelia)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.project }}-sure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  destination:
    namespace: {{ .Release.Namespace }}
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  sources:
    - path: charts/template-single
      repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      helm:
        valueFiles:
          - $values/charts/mordor/sure.values.yaml
    - repoURL: https://github.com/drgroot/kubespray.git
      targetRevision: HEAD
      ref: values
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sure-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        RAILS_ENV: production
        SELF_HOSTED: "true"
        ASSISTANT_TYPE: mcp_only
        ACTIVE_STORAGE_SERVICE: generic_s3
        GENERIC_S3_FORCE_PATH_STYLE: "true"
        AUTH_LOCAL_LOGIN_ENABLED: "false"
        AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED: "false"
        AUTH_PASSKEY_LOGIN_ENABLED: "true"
        ONBOARDING_STATE: closed
        AUTH_JIT_MODE: create_and_link
        RAILS_FORCE_SSL: "false"
        RAILS_ASSUME_SSL: "true"
        APP_DOMAIN: sure.{{ .Values.domains.external }}
        APP_URL: https://sure.{{ .Values.domains.external }}
        REDIS_URL: {{ "{{ .redis_url }}/1" | quote }}
        OIDC_ISSUER: https://auth.yusufali.ca
        OIDC_CLIENT_ID: sure
        OIDC_REDIRECT_URI: https://sure.{{ .Values.domains.external }}/auth/openid_connect/callback
        OIDC_BUTTON_LABEL: Sign in with Authelia
  data:
    - secretKey: redis_url
      remoteRef:
        key: dynamic/redis
        property: url
    - secretKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      remoteRef:
        key: vendor/selfhosted-app-tokens
        property: sure-ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - secretKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      remoteRef:
        key: vendor/selfhosted-app-tokens
        property: sure-ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - secretKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      remoteRef:
        key: vendor/selfhosted-app-tokens
        property: sure-ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: vendor/selfhosted-app-tokens
        property: sure-SECRET_KEY_BASE
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: dynamic/authelia-client-creds
        property: client-secret-sure
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-postgres-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sure-postgres-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: dynamic/postgres-app-sure
        property: hostname
    - secretKey: DB_PORT
      remoteRef:
        key: dynamic/postgres-app-sure
        property: port
    - secretKey: POSTGRES_USER
      remoteRef:
        key: dynamic/postgres-app-sure
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: dynamic/postgres-app-sure
        property: password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: dynamic/postgres-app-sure
        property: database
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.project }}-sure
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: gateway
    namespace: system-envoy
    sectionName: https
  hostnames:
  - sure.{{ .Values.domains.external }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - name: Upgrade
        value: websocket
    backendRefs:
    - name: sure
      port: 3000
    name: websocket-0
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: sure
      port: 3000
    name: http-0
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Values.project }}-sure
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .Values.project }}-sure
    sectionName: http-0
  requestBuffer:
    limit: 100Mi
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 600s
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-s3-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sure-s3-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GENERIC_S3_ACCESS_KEY_ID
      remoteRef:
        key: dynamic/s3-sure
        property: accesskey
    - secretKey: GENERIC_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: dynamic/s3-sure
        property: secretkey
    - secretKey: GENERIC_S3_BUCKET
      remoteRef:
        key: dynamic/s3-sure
        property: bucket
    - secretKey: GENERIC_S3_REGION
      remoteRef:
        key: dynamic/s3-sure
        property: region
    - secretKey: GENERIC_S3_ENDPOINT
      remoteRef:
        key: dynamic/s3-sure
        property: blob-url

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Values.project }}-sure-websocket
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.project }}-sure
      sectionName: websocket-0
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 600s
